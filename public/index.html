:root{
  --bg:#F5F3ED;--surface:#FFFEFA;--surface2:#EDEFE9;--fg:#183235;--muted:#647979;--line:#E1E5DF;
  --accent:#E94F3D;--accenttext:#B74A3D;--sos:#E94F3D;--sage:#91B5A8;--mint:#DCECE5;
  --c-sight:#D83A2E;--c-food:#C77D00;--c-stay:#2C5BD4;--c-store:#168A5C;--c-gov:#3B4350;--c-transit:#0C8CA6;--c-event:#A83A86;--c-shop:#7A4FD6;--c-school:#8A5A2B;
  --glyph:#FFFFFF;--pinedge:#FFFFFF;--shadow:0 18px 55px rgba(24,50,53,.09);
  --night:#08141D;
  --fontb:"Pretendard","Pretendard Variable",system-ui,-apple-system,"Apple SD Gothic Neo","Hiragino Sans","PingFang SC","PingFang TC","Microsoft YaHei","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--fontb);font-size:16px;line-height:1.5;margin:0;padding-block:0 0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* night scope: header + hero + map keep one dark look in every theme */
.night{--surface:#122230;--surface2:#1B3144;--fg:#EAF3F8;--muted:#A3BBC9;--line:#2C4558;
  --accent:#FF4A3D;--accenttext:#FF7A6F;--glyph:#0B1416;--pinedge:#08141D;
  --c-sight:#FF6A5C;--c-food:#FFB627;--c-stay:#6E93FF;--c-store:#3ECF94;--c-gov:#A9B5C8;--c-transit:#36C8E0;--c-event:#E070BC;--c-shop:#B58CFF;--c-school:#D9A066;
  background:var(--night);color:var(--fg);color-scheme:dark}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(245,243,237,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:9px 0}
.row1{display:flex;align-items:center;gap:10px}
.langw{display:flex;align-items:center;gap:6px;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 6px 0 12px;min-height:42px}
.langw svg{flex:none}
#lang{background:transparent;border:0;color:var(--fg);min-height:40px;font-weight:700;max-width:118px;padding:0 2px;font-size:14px}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;justify-content:center;text-decoration:none;color:var(--fg)}
.wm{font-weight:850;font-size:16px;letter-spacing:.07em;white-space:nowrap}
.wm span{color:var(--accent)}
.sos{flex:none;background:var(--sos);color:#fff;border:0;border-radius:999px;font-weight:800;min-height:42px;padding:0 16px;letter-spacing:.04em}
.tabs{display:none}
.hero{padding:28px 0 10px}
.eyebrow{color:var(--accenttext);text-transform:uppercase;letter-spacing:.16em;font-weight:850;font-size:11px}
.h1{margin:12px 0 12px;font-weight:850;font-size:clamp(40px,11vw,68px);line-height:1;letter-spacing:-.045em;text-wrap:balance}
.h1 span{color:var(--accent);display:block}
.heroQ{display:inline-block;margin:2px 0 14px;padding:8px 16px;border-radius:999px;background:var(--fg);color:var(--bg);font-weight:850;font-size:clamp(16px,4.6vw,20px);letter-spacing:-.01em}
.heroP{max-width:46ch;color:var(--muted);margin:0 0 18px;font-size:16px}
.search{position:relative;display:flex;max-width:520px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.search svg{flex:none;margin:12px 4px 0 10px;color:var(--muted)}
.search input{border:0;outline:0;background:transparent;min-width:0;flex:1;font:inherit;font-size:15px;color:var(--fg);padding:0 8px;min-height:44px}
.search button{border-radius:11px;background:var(--fg);color:#fff;font-weight:750;padding:0 18px;min-height:44px;border:0}
.sres{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:340px;overflow:auto}
.sres button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 14px;min-height:48px}
.sres button:first-child{border-top:0}
.sres i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.sres span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sres em{font-style:normal;color:var(--muted);font-size:12.5px}
.micro{color:#869492;font-size:12px;margin:10px 0 0}
.cta{display:flex;margin:14px 0 0}
.cta button{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;border:1px solid var(--accent);background:transparent;color:var(--accenttext);font-weight:800;font-size:15px}
.mapsec{padding:14px 0 0;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 64px)}

/* map */
.mapbox{color:var(--fg);position:relative;height:clamp(500px,76vh,760px);border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#EEEBE0;user-select:none;-webkit-user-select:none;box-shadow:0 0 0 1px rgba(255,255,255,.03),0 18px 50px rgba(24,50,53,.12)}
#gl.gl{position:absolute;inset:0;width:100%;height:100%}
.maplibregl-ctrl-attrib{background:rgba(255,254,250,.8)!important;color:#647979!important;font-size:11px}
.maplibregl-ctrl-attrib a{color:#CFE3EE!important}
.mapfail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#CFE3EE;z-index:2}
.pins{position:absolute;inset:0;pointer-events:none}
.pins>*{pointer-events:auto}
.rpin{position:absolute;left:0;top:0;display:none;align-items:center;gap:6px;background:rgba(255,254,250,.94);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 7px;font-size:12.5px;font-weight:600;line-height:1.2;white-space:nowrap;box-shadow:0 2px 8px rgba(24,50,53,.14);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.rpin svg{flex:none;width:14px;height:18px;display:block}
.rpin .pg{fill:#B9C4C0}
.rpin .pd{fill:#183235}
.rpin i{font-style:normal;font-variant-numeric:tabular-nums;font-size:11.5px;opacity:.8}
.rpin.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,74,61,.25),0 2px 10px rgba(24,50,53,.2)}
.rpin.on .pg{fill:var(--accent);filter:drop-shadow(0 0 5px rgba(255,74,61,.9))}
.rpin.lite{padding:4px 5px;border-radius:12px}
.rpin.lite b,.rpin.lite i{display:none}
.rpin.done{border-color:#3ECF94}
.rpin .pn{fill:none;stroke:#8C9A98;stroke-width:2.6;stroke-linecap:round}
.rpin.on .pn{stroke:var(--accent)}
.pin{transform-origin:50% 100%;position:absolute;left:0;top:0;width:28px;height:36px;padding:0;border:0;background:none;display:none;will-change:transform}
.pin svg{display:block;width:28px;height:36px;overflow:visible;filter:drop-shadow(0 1px 2px rgba(24,50,53,.3))}
.pin .chk,.pin .flm{display:none}
.pin.vis .chk{display:inline}
.pin.film .flm{display:inline}
.peek{display:flex;gap:12px;align-items:center;cursor:pointer;margin:0 0 10px}
.pkph{flex:none;width:76px;height:76px;border-radius:14px;background:var(--surface2) center/cover no-repeat}
.pkb{flex:1;min-width:0}
.pkb h3{margin:2px 0 2px;font-size:18px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pkb .reg,.pkb .tag{font-size:12px}
.pk1{margin:0;color:var(--muted);font-size:13.5px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.more{font-size:14px;width:100%;min-height:42px;margin-top:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:750;color:var(--fg)}
.sheet.pk{max-height:none;overflow:visible}
.sheet.pk .x{position:absolute;right:8px;top:8px;z-index:2}
.about{white-space:pre-line}
@media (min-width:900px){
 .sheet{left:12px;right:auto;top:56px;bottom:12px;width:350px;max-height:none}
 .sheet.pk{bottom:auto}
}
.medot{position:absolute;left:0;top:0;z-index:20;width:20px;height:20px;border-radius:50%;background:#2C5BD4;border:3px solid #fff;box-shadow:0 0 0 8px rgba(44,91,212,.22),0 2px 8px rgba(24,50,53,.35);display:none;pointer-events:none;animation:mep 2.4s ease-out infinite}
@keyframes mep{0%{box-shadow:0 0 0 0 rgba(44,91,212,.45),0 2px 8px rgba(24,50,53,.35)}100%{box-shadow:0 0 0 18px rgba(44,91,212,0),0 2px 8px rgba(24,50,53,.35)}}
.me.__x{width:18px;height:18px;border-radius:50%;background:#2C5BD4;border:3px solid #fff;box-shadow:0 0 0 7px rgba(44,91,212,.22),0 2px 6px rgba(24,50,53,.3)}
.ctl button.on{background:#2C5BD4;color:#fff;border-color:#2C5BD4}
.dist{margin:6px 0 0;font-size:13px;font-weight:700;color:var(--fg)}
.rt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 0}
.rt a{display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:12px;background:var(--fg);color:#fff;text-decoration:none;font-weight:750;font-size:14px;padding:6px 8px;text-align:center}
.rt a.kk{background:#FEE500;color:#183235}
.rth{margin:6px 0 0;font-size:12px;color:var(--muted)}
.rth button{background:none;border:0;padding:0;color:#2C5BD4;font-weight:750;text-decoration:underline;font-size:12px}
.fog{position:absolute;inset:0;pointer-events:none;z-index:1;background:linear-gradient(180deg,#F2EFE5 0%,rgba(242,239,229,.9) 8%,rgba(242,239,229,0) 34%),radial-gradient(ellipse 120% 90% at 50% 58%,rgba(242,239,229,0) 55%,rgba(236,232,220,.7) 100%)}
.snsr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:0;text-decoration:none;flex:none;box-shadow:0 1px 4px rgba(24,50,53,.18)}
.sb svg{width:19px;height:19px;display:block}
.sb.yt{background:#fff;border:1px solid var(--line)}
.sb.ig{background:linear-gradient(45deg,#F9A03F,#E1306C 55%,#7B3FD4)}
.sb.tt{background:#111}
.snstag{font-size:12.5px;font-weight:750;color:var(--muted);margin-left:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.pks{margin:8px 0 0;padding-top:8px;border-top:1px solid var(--line)}
.snsg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:10px;margin:0;padding:0;list-style:none}
.snsg li{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0;display:flex;flex-direction:column;overflow:hidden}
.snsp{position:relative;height:104px;background:#2c3e3c center/cover no-repeat;display:flex;align-items:flex-end;padding:10px 12px}
.snsp:before{content:"";position:absolute;inset:0;background:linear-gradient(205deg,rgba(255,79,154,.30) 0%,rgba(122,60,255,.10) 38%,rgba(14,26,34,.80) 100%)}
.snsp b{position:relative;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.snsb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.snsg b{font-size:15.5px;line-height:1.3}
.snsg .ht{font-size:13px;color:var(--accenttext);font-weight:800}
.rankp{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:12px;margin:0;padding:0;list-style:none}
.rankp button{position:relative;width:100%;height:176px;border-radius:18px;overflow:hidden;border:0;background:#C9D4CC center/cover no-repeat;color:#fff;text-align:left;padding:12px 14px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.rankp button:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,46,45,.05) 25%,rgba(21,46,45,.78))}
.rankp button>*{position:relative}
.rankp .rn{position:absolute;left:12px;top:10px;font-weight:850;font-size:34px;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.rankp .nm{font-weight:800;font-size:17px;line-height:1.25}
.rankp small{opacity:.88;font-size:12.5px}
.bform{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 14px}
.bform input,.bform textarea,.rform input{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
.bform textarea{min-height:92px;resize:vertical}
.bform .brow{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.bform button.send,.rform button{min-height:46px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:800;font-size:15px;padding:0 18px}
.bnote{font-size:12px;color:var(--muted);margin:0}
.bmsg{font-size:13px;font-weight:700;color:var(--accenttext);margin:0;min-height:1em}
.bsort{display:flex;gap:6px;margin:0 0 12px}
.bsort button{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px}
.bsort button[aria-pressed="true"]{background:var(--fg);color:#fff;border-color:var(--fg)}
.bpost{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 10px}
.bpost .pl{display:inline-block;background:var(--mint);border-radius:999px;padding:3px 12px;font-weight:800;font-size:13px}
.bpost .who{color:var(--muted);font-size:12.5px;margin:6px 0 6px}
.bpost .bd{margin:0;white-space:pre-wrap;word-break:break-word;font-size:15px}
.bpost .tr{margin:6px 0 0;padding:8px 10px;background:var(--surface2);border-radius:10px;font-size:14px;white-space:pre-wrap}
.bact{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.bact button{min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;color:var(--fg)}
.bact button.lk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.bact button.sm{color:var(--muted);font-weight:600}
.brep{margin:10px 0 0;padding:10px 0 0 12px;border-left:3px solid var(--sage);display:grid;gap:8px}
.brep p{margin:0;font-size:14px;white-space:pre-wrap;word-break:break-word}
.brep small{color:var(--muted)}
.rform{display:flex;gap:6px;margin:4px 0 0}
.rform input{flex:1;min-width:0}
.spotdim{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity .35s;background:radial-gradient(circle 120px at var(--sx,50%) var(--sy,50%),rgba(245,243,237,0) 0,rgba(245,243,237,0) 60%,rgba(236,233,223,.82) 100%)}
.mapbox.spot .spotdim{opacity:1}
.mapbox.spot .pin:not(.sel),.mapbox.spot .cl,.mapbox.spot .rpin{opacity:.3}
.pin.sel{z-index:5}
.pin.sel svg{transform:scale(1.3);transform-origin:50% 100%}
.plabel{position:absolute;left:50%;top:-22px;transform:translateX(-50%);white-space:nowrap;background:#fff;color:#08141D;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;display:none;pointer-events:none}
.pin.sel .plabel{display:block}
.cl{position:absolute;left:0;top:0;width:36px;height:36px;border-radius:50%;display:none;align-items:center;justify-content:center;background:#fff;color:#08141D;border:2px solid #E94F3D;font-weight:800;font-size:13px;opacity:.92;box-shadow:0 2px 8px rgba(24,50,53,.2)}
.ctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:8}
.ctl button{box-shadow:0 2px 8px rgba(24,50,53,.12);width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(255,254,250,.94);color:var(--fg);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center}
.chip{position:absolute;left:10px;top:10px;z-index:7;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 70px)}
.chip span{background:rgba(255,254,250,.94);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.chip b{color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 8px}
.lg{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 5px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;min-height:36px}
.lg[aria-pressed="false"]{opacity:.45}
.lg svg{display:block}
.note{font-size:12.5px;color:var(--muted);margin:0 0 4px}

/* sheet */
.sheet{position:absolute;left:8px;right:8px;bottom:8px;max-height:62%;overflow:auto;background:rgba(255,254,250,.985);border:1px solid var(--line);border-radius:16px;padding:12px 14px 14px;z-index:9;box-shadow:0 8px 28px rgba(24,50,53,.2)}
.sh-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.tag i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.reg{font-size:13px;color:var(--muted);flex:1}
.x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:20px;line-height:1}
.sheet h3{font-weight:800;font-size:22px;line-height:1.25;margin:2px 0 6px}
.sheet p{margin:0 0 8px}
.dim{color:var(--muted);font-size:13px}
.vbtn{width:100%;min-height:46px;border-radius:12px;border:2px solid var(--c-store);background:transparent;font-weight:700;margin:2px 0 10px}
.vbtn[aria-pressed="true"]{background:var(--c-store);color:#fff}
.box{background:var(--surface2);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.box h4{margin:0 0 4px;font-size:13px;letter-spacing:.04em;color:var(--muted)}
.box p{margin:0}
.nr{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 0;min-height:40px;font-size:14px}
.nr:first-of-type{border-top:0}
.nr i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.nr span{flex:1;min-width:0}
.nr em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.sns{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.sns span{border:1px dashed var(--muted);color:var(--muted);border-radius:999px;padding:4px 12px;font-size:13px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links a{display:flex;align-items:center;justify-content:center;text-align:center;min-height:46px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-weight:700;font-size:14px;padding:6px 8px}
.tagx{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px dashed var(--muted);color:var(--muted);border-radius:6px;padding:0 6px}

/* content bands */
.band{padding:34px 0 6px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 110px)}
.h2{font-weight:800;font-size:clamp(24px,5.4vw,34px);line-height:1.2;margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 16px;max-width:70ch}
.best{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:0;padding:0;list-style:none}
.bc{width:100%;height:100%;text-align:left;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.bc:hover{background:var(--surface2)}
.rk{font-weight:800;font-size:44px;line-height:1;color:var(--accenttext);font-variant-numeric:tabular-nums}
.bc h3{font-weight:800;font-size:19px;line-height:1.3;margin:0}
.bc .r{font-size:13px;color:var(--muted)}
.bc p{margin:0;font-size:15px;flex:1}
.go{font-size:13px;font-weight:700;color:var(--accenttext)}
.rev,.phr,.off{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.rv{border:1px dashed var(--muted);border-radius:18px;padding:16px}
.rv p{margin:8px 0 6px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.cc{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 14px;min-height:46px;font-weight:600;flex:1 1 auto;justify-content:center}
.cc code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-weight:700;background:var(--surface2);border-radius:6px;padding:2px 6px}
.cc[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cc[aria-pressed="true"] code{background:var(--bg);color:var(--fg)}
.rank{margin:0 0 10px;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.rank button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-height:56px}
.rank b{font-weight:800;font-size:22px;width:26px;color:var(--accenttext)}
.rank span{flex:1;min-width:0}
.rank small{display:block;color:var(--muted);font-size:13px}
.oc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.oc h3{margin:0 0 2px;font-size:17px;font-weight:700}
.oc .o{font-size:13px;color:var(--muted);margin:0 0 6px}
.oc p{margin:0 0 10px}
.oc a{font-weight:700;font-size:14px;color:var(--accenttext)}
.st{display:inline-block;font-size:12px;font-weight:700;background:var(--surface2);border-radius:6px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.pc .pg{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.pk{font-weight:800;font-size:28px;line-height:1.3;margin:2px 0}
.prm{color:var(--muted);font-size:14px;margin:0}
.pt{font-size:17px;margin:8px 0 10px}
.pb{display:flex;gap:8px}
.pb button{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:700;font-size:14px}
.pb button.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.next{margin:0;padding-left:20px;color:var(--muted)}
footer{padding:34px 0 calc(48px + env(safe-area-inset-bottom,0px))}
footer .h2{font-size:18px}

/* overlays */
.ov{position:fixed;inset:0;z-index:60;background:rgba(24,50,53,.3);display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{background:var(--surface);color:var(--fg);border-radius:20px;width:min(560px,100%);max-height:88vh;overflow:auto;padding:18px}
.panel h2{font-weight:800;font-size:24px;margin:0 0 10px}
.sr{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:10px 0}
.sr:first-of-type{border-top:0}
.sr strong{font-weight:800;font-size:30px;min-width:92px;user-select:all;-webkit-user-select:all;font-variant-numeric:tabular-nums}
.sr span{flex:1;min-width:0}
.sr a{flex:none;background:var(--sos);color:#fff;text-decoration:none;font-weight:700;border-radius:10px;padding:8px 14px;min-height:40px;display:flex;align-items:center}
.close{margin-top:12px;width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:700}
.ov.big{background:#08141D;color:#fff;align-items:center;flex-direction:column;justify-content:center;text-align:center;gap:18px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.ov.big .bk{font-weight:800;font-size:clamp(40px,13vw,84px);line-height:1.25;text-wrap:balance}
.ov.big .bt{font-size:clamp(18px,5vw,28px);opacity:.85}
.ov.big button{min-height:50px;padding:0 28px;border-radius:14px;border:2px solid #fff;background:transparent;color:#fff;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 16px;font-size:14px;max-width:90vw}

/* interpreter + CTA */


.cta svg{flex:none}
.ctl button.zi{background:var(--accent);border-color:var(--accent);color:#fff}

.ipanel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
.iplang{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.iplang select{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);padding:0 10px;font-weight:600}
.kobadge{min-height:44px;display:inline-flex;align-items:center;border-radius:12px;background:var(--fg);color:var(--bg);padding:0 14px;font-weight:700}
.ilog{min-height:150px;max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 8px}
.iempty{margin:auto;color:var(--muted);text-align:center}
.msg{max-width:88%;border-radius:16px;padding:10px 12px;background:var(--surface2)}
.msg.me{align-self:flex-end;border-bottom-right-radius:4px}
.msg.ko{align-self:flex-start;border-bottom-left-radius:4px;background:var(--bg);border:1px solid var(--line)}
.mo{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.mt{font-size:19px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.merr{color:var(--accenttext);font-size:14px;font-weight:600}
.ma{display:flex;gap:6px;margin-top:6px}
.ma button{min-height:34px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:13px;font-weight:600}
.ilive{min-height:22px;color:var(--accenttext);font-weight:600;font-size:15px;padding:0 2px}
.ibtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 10px}
.mic{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:84px;border-radius:18px;border:0;font-weight:800;font-size:14px;line-height:1.25;padding:8px;text-align:center}
.mic.me{background:var(--accent);color:#fff}
.mic.ko{background:var(--fg);color:var(--bg)}
.mic.rec{outline:4px solid var(--accent);outline-offset:2px;animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(255,74,61,.15)}}
.itext{display:flex;gap:8px}
.itext input{flex:1;min-width:0;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 12px;font:inherit}
.itext button{flex:none;min-height:46px;border-radius:12px;border:0;background:var(--fg);color:var(--bg);font-weight:700;padding:0 18px}
.iauto{display:flex;align-items:center;gap:8px;margin:10px 0 4px;font-size:14px;color:var(--muted)}
.iauto input{width:20px;height:20px}
.phc{font-weight:800;font-size:18px;margin:22px 0 8px}
.phc.big{font-size:26px;margin:10px 0 4px;display:flex;align-items:center;gap:8px}
.scn{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sc{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:60px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-size:16px}
.sc:hover{background:var(--surface2)}
.sc i{font-style:normal;font-size:12px;color:var(--muted);background:var(--surface2);border-radius:999px;padding:1px 8px}
.back{min-height:42px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-weight:700}
.pin .pph{display:none}
.pin.ph{width:46px;height:54px}
.pin.ph .pslot{display:none}
.pin.ph .pph{display:block;position:absolute;left:3px;top:0;width:40px;height:40px;border-radius:50%;border:3px solid var(--c,#fff);background:#E8E6DC center/cover no-repeat;box-shadow:0 2px 6px rgba(24,50,53,.3)}
.pin.ph::after{content:"";position:absolute;left:50%;top:40px;transform:translateX(-50%);border:7px solid transparent;border-top:12px solid var(--c,#fff);border-bottom:0}
.bph{display:block;width:100%;height:120px;border-radius:12px;background:var(--surface2) center/cover no-repeat}
.sph{height:150px;border-radius:12px;background:#E8E6DC center/cover no-repeat;margin:0 0 8px}
.bnav{display:none}
.favs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px;margin:0;padding:0;list-style:none}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 6px 22px rgba(24,50,53,.05);display:flex;flex-direction:column;height:100%}
.fphoto{position:relative;height:160px;background:linear-gradient(150deg,#E4D3BC,#B9CBBF) center/cover no-repeat;cursor:pointer}
.fphoto:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(21,46,45,.3))}
.fbadge{position:absolute;top:12px;left:12px;z-index:1;background:rgba(255,254,250,.93);border-radius:999px;padding:5px 10px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.fplay{position:absolute;right:12px;bottom:12px;z-index:1;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--accent);border:0}
.fbody{padding:14px 15px 16px;display:flex;flex-direction:column;gap:5px;flex:1}
.ftop{display:flex;justify-content:space-between;align-items:center;color:var(--accenttext);font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:850}
.fsave{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;border:0;color:var(--fg)}
.fsave[aria-pressed="true"]{background:var(--accent);color:#fff}

var TR2={"Prototype · descriptions and rankings are samples until public data is connected.": {"ja": "プロトタイプ・説明およびランキングは、パブリックデータが接続されるまでのサンプルです。", "zh": "原型 · 描述和排名是样本，直到连接公共数据。", "tw": "原型 · 描述和排名在連接公開資料之前僅供參考。", "es": "Prototipo · las descripciones y clasificaciones son muestras hasta que se conecten los datos públicos."}, "Dashed lines are province borders. Zoom in to see city borders. Pin colors show the type.": {"ja": "破線は省の境界線です。市の境界線を見るにはズームインしてください。ピンの色は種類を示しています。", "zh": "虚线代表省界，放大即可看到城市边界，针颜色代表类型", "tw": "虛線代表省界，放大即可看到城市界限，釘子顏色代表類型。", "es": "Las líneas discontinuas son fronteras de provincia. Amplíe para ver las fronteras de la ciudad. Los colores de los marcadores muestran el tipo."}, "Prototype: saved on this device only.": {"ja": "このデバイスのみに保存されています。", "zh": "仅保存在此设备上。", "tw": "原型：僅儲存在此裝置中。", "es": "Prototipo: guardado solo en este dispositivo."}, "Shown after data is connected": {"ja": "データが接続された後に表示されます", "zh": "连接数据后显示", "tw": "連接資料後顯示", "es": "Se muestra después de que se conectan los datos"}, "YouTube, Instagram and TikTok links will appear here after filming.": {"ja": "YouTube、Instagram、TikTokのリンクは、撮影後こちらに掲載されます。", "zh": "YouTube，Instagram和TikTok的链接将在拍摄后出现在这里。", "tw": "YouTube、Instagram和TikTok的連結將在拍攝完成後出現在這裡。", "es": "Enlaces de YouTube, Instagram y TikTok aparecerán aquí después de la filmación."}, "Sample picks. They will be replaced by tourism-agency event data and our crew’s recommendations.": {"ja": "サンプルのピックです。これらは観光局のイベントデータや私たちのクルーのお勧めに置き換えられます。", "zh": "示例选项，将会被旅游机构的活动数据和我们的工作人员推荐所取代", "tw": "範例選項，將會被替換為旅遊社的活動資料和我們團隊的推薦。", "es": "Selecciones de ejemplo. Serán reemplazadas por datos de eventos de la agencia de turismo y las recomendaciones de nuestro equipo."}, "At launch this section starts with visit notes from the PINNED KOREA crew. Traveler reviews open once there are users.": {"ja": "開始時にこのセクションはPINNED KOREAクルーの訪問ノートから始まります。ユーザーがいる場合、旅行者のレビューが開きます。", "zh": "启动时，该板块首先显示PINNED KOREA团队的访问笔记，一旦有用户后就会开放旅行者评论。", "tw": "啟動時，這個板塊先顯示PINNED KOREA團隊的遊記，當有用戶留言後，將開放旅客評論。", "es": "Al lanzamiento esta sección comienza con notas de visita del equipo PINNED KOREA. Las reseñas de los viajeros se abren una vez que hay usuarios."}, "Review text appears here.": {"ja": "レビューのテキストがここに表示されます。", "zh": "评论文字显示在这里。", "tw": "評論文字出現在這裡。", "es": "El texto de la reseña aparece aquí."}, "Visited pin · Reviewer’s country": {"ja": "訪問したピン · レビュアーの国", "zh": "访问过的地点 · 评论者所在国家", "tw": "參觀過的評分 · 評論者所在國家", "es": "Visitó pin · País del revisor"}, "Pick a country to see where its visitors go.": {"ja": "国を選んで、その国に訪れる人の行き先を見てみましょう。", "zh": "选择一个国家来看看它的游客会去哪里。", "tw": "選一個國家來看看它的遊客會去哪裡。", "es": "Elige un país para ver a dónde van sus visitantes."}, "Sample ranking. It will switch to real figures, with sources, once official statistics are connected.": {"ja": "サンプルランキングです。公式統計が接続されると、実際の数字と出典に切り替わります。", "zh": "样本排名，一旦官方统计数据连接后，将会切换到真实数据，并附上来源。", "tw": "排名樣本，將在官方統計數據連接後，切換為真實數據，並附上來源。", "es": "Clasificación de muestra. Cambiará a cifras reales, con fuentes, una vez que se conecten las estadísticas oficiales."}, "Only figures from trusted public agencies go here, kept separate from our own picks (Top 5).": {"ja": "信頼できる公的機関からの数字のみがこちらに記載され、当社の独自のピック（トップ5）とは別々に保管されます。", "zh": "这里只列出来自可靠的公共机构的数据，与我们自己的选择（前5名）分开。", "tw": "只有來自值得信賴的公共機構的數據才能放在這裡，並且與我們自己的選擇（前5名）分開。", "es": "Solo las cifras de agencias públicas de confianza van aquí, manteniéndolas separadas de nuestras propias selecciones (Top 5)."}, "Languages other than English are machine-translated and load the first time you open a situation.": {"ja": "英語以外の言語は機械翻訳されており、状況を開いた最初の時に読み込まれます。", "zh": "除了英语以外的语言是通过机器翻译的，并且在您第一次打开某个情况时加载。", "tw": "除英語以外的語言是透過機器翻譯，在您第一次開啟情境時載入。", "es": "Los idiomas distintos del inglés se traducen automáticamente y se cargan la primera vez que abres una situación."}, "Sound playback isn’t available here.": {"ja": "ここでは音声の再生は利用できません。", "zh": "这里无法播放声音。", "tw": "這裡無法播放聲音。", "es": "La reproducción de sonido no está disponible aquí."}, "Numbers are for the prototype and will be re-checked before launch. If the call button does nothing, dial the number yourself.": {"ja": "はプロトタイプ用の番号で、発売前に再確認されます。如果ボタンを押しても何も起こらない場合、番号を自分でダイヤルしてください。", "zh": "数字只是用于原型测试，在正式发布前会重新核对，如果呼叫按钮无反应，可以自己直接拨打电话号码。", "tw": "數字是為了原型而設，將在發佈前重新核對。如果呼叫按鈕無法使用，請自行撥打電話號碼。", "es": "Los números son para el prototipo y se volverán a verificar antes del lanzamiento. Si el botón de llamada no hace nada, marca el número tú mismo."}, "Loading places from Korea Tourism Organization…": {"ja": "韓国観光公社から場所を読み込み中…", "zh": "正在从韩国旅游组织加载景点信息…", "tw": "從韓國觀光公社載入景點…", "es": "Cargando lugares de la Organización de Turismo de Corea…"}, "Source: Korea Tourism Organization (TourAPI)": {"ja": "韓国観光公社（TourAPI）", "zh": "来源：韩国旅游组织（TourAPI）", "tw": "來源：韓國觀光公社（TourAPI）", "es": "Organización de Turismo de Corea (TourAPI)"}, "Couldn’t load tourism data. Showing sample pins only.": {"ja": "観光データの読み込みに失敗しました。サンプルのピンだけを表示しています。", "zh": "无法加载旅游数据，只显示样本标记。", "tw": "無法載入旅遊資料，目前只顯示示範標籤。", "es": "No se pudo cargar los datos de turismo. Se muestran solo los puntos de muestra."}, "Official listing": {"ja": "公式の掲載", "zh": "正式列表", "tw": "官方列表", "es": "Lista oficial"}, "Zoom in": {"ja": "拡大してください", "zh": "放大", "tw": "放大", "es": "Ampliar"}, "Zoom out": {"ja": "ズームアウトしてください", "zh": "拉远镜头", "tw": "拉遠鏡頭", "es": "Aleja la cámara"}, "Reset map": {"ja": "マップをリセットしてください", "zh": "重置地图", "tw": "重設地圖", "es": "Reiniciar mapa"}, "Photo: Korea Tourism Organization": {"ja": "フォト: 韓国観光公社", "zh": "照片：韩国旅游组织", "tw": "照片：韓國觀光公社", "es": "Foto: Organización de Turismo de Corea"}, "Map could not be loaded. Please check your connection and reload.": {"ja": "マップを読み込むことができませんでした。接続を確認して再読み込みしてください。", "zh": "地图无法加载，请检查您的网络连接并重新加载。", "tw": "地圖無法載入，請檢查您的連線並重新載入。", "es": "No se pudo cargar el mapa. Por favor, verifique su conexión y vuelva a cargar."}, "Beta. Translations are machine-made, so double-check anything important (medical, contracts). If the mic does nothing, open this page in Chrome or Safari.": {"ja": "ベータです。翻訳は機械で行われるため、重要な情報（医療、契約書など）については、必ず再確認してください。マイクが反応しない場合は、このページをChromeまたはSafariで開いてください。", "zh": "Beta翻译是由机器生成的，因此对于重要信息（如医疗或合同），请务必再次核实。如果麦克风不工作，请在Chrome或Safari中打开此页面。", "tw": "Beta，翻譯是由機器製作的，因此對於重要資訊（如醫療或合約）請再次確認。如果麥克風無法使用，請在Chrome或Safari瀏覽器中開啟此頁面。", "es": "Beta. Las traducciones son generadas por máquina, así que verifique cualquier cosa importante (médica, contratos). Si el micrófono no funciona, abra esta página en Chrome o Safari."}, "This browser doesn’t support speech recognition. Please type instead.": {"ja": "このブラウザは音声認識をサポートしていません。代わりにタイプしてください。", "zh": "这个浏览器不支持语音识别，请改用输入法。", "tw": "這個瀏覽器不支援語音辨識，請改用鍵盤輸入。", "es": "Este navegador no admite reconocimiento de voz. Por favor, escriba en su lugar."}, "Please allow microphone access.": {"ja": "マイクへのアクセスを許可してください。", "zh": "请允许使用麦克风权限。", "tw": "請允許麥克風存取。", "es": "Por favor, permita el acceso al micrófono."}, "Translation failed. Please try again.": {"ja": "翻訳に失敗しました。再度試してください。", "zh": "翻译失败，请再试一次。", "tw": "翻譯失敗，請再試一次。", "es": "La traducción ha fallado. Por favor, inténtelo de nuevo."}, "Save your pins with Google or Apple sign-in": {"ja": "GoogleまたはAppleのサインインでピンを保存する", "zh": "使用谷歌或苹果账号登录保存您的收藏", "tw": "使用Google或Apple登入來儲存您的PIN碼", "es": "Guarda tus pines con inicio de sesión de Google o Apple"}, "“PINNED KOREA verified” photo cards": {"ja": "PINNED KOREA 認証済み 写真カード", "zh": "PINNED KOREA 已验证 的照片卡", "tw": "PINNED KOREA 驗證照片卡", "es": "tarjetas de fotos verificadas PINNED KOREA"}, "Better interpreter (conversation mode, offline)": {"ja": "より優れた通訳（会話モード、オフライン）", "zh": "更好的口译（对话模式，离线）", "tw": "更好的口譯（對話模式，離線）", "es": "Mejor intérprete (modo conversación, sin conexión)"}, "Tourism agency and official statistics": {"ja": "観光庁と公式統計", "zh": "旅游机构和官方统计数据", "tw": "觀光旅遊局和官方統計數據", "es": "Agencia de turismo y estadísticas oficiales"}, "Filmed videos (YouTube, Instagram, TikTok)": {"ja": "ユーチューブやインスタグラム、ティックトックなどの動画を撮影しました", "zh": "拍摄的视频（YouTube，Instagram，TikTok）", "tw": "拍攝的影片（YouTube、Instagram、TikTok）", "es": "Vídeos filmados (YouTube, Instagram, TikTok)"}, "Real store locations appear once map data is connected.": {"ja": "マップデータが接続されると実店舗のロケーションが表示されます。", "zh": "连接地图数据后，真实店铺位置就会出现。", "tw": "連接地圖資料後，實體店鋪位置會出現。", "es": "Las ubicaciones reales de las tiendas aparecen una vez que se conectan los datos del mapa."}, "Real lodging appears once tourism lodging data is connected.": {"ja": "観光宿泊データが接続されると実際の宿泊施設が表示されます。", "zh": "真正的住宿信息会在连接旅游住宿数据后出现。", "tw": "當連接觀光旅宿資料後，實際的住宿資訊就會出現。", "es": "El alojamiento real aparece una vez que se conectan los datos de alojamiento turístico."}, "Public office location.": {"ja": "お役所の場所はどこですか", "zh": "办公室地址在哪里", "tw": "公務機關所在地", "es": "Ubicación de la oficina pública."}, "Routes and times appear once public transit data is connected.": {"ja": "公共交通データが接続されると、ルートや時間が表示されます。", "zh": "公共交通数据连接后会显示路线和时间。", "tw": "當連接公共交通資料後，路線和時間會出現。", "es": "Las rutas y los horarios aparecen una vez que se conectan los datos del transporte público."}, "Real dates appear once tourism event data is connected.": {"ja": "観光イベントのデータが接続されると、実際の日付が表示されます。", "zh": "当旅游活动数据连接后，真实日期就会出现。", "tw": "當連接旅遊活動資料後，實際日期將會出現。", "es": "Las fechas reales aparecen una vez que se conectan los datos del evento de turismo."}, "The description will be filled in after filming and data connection.": {"ja": "撮影とデータ接続後で説明を記入します。", "zh": "拍摄和数据连接完成后将填写描述", "tw": "拍攝及資料連接完成後將會填入描述。", "es": "La descripción se llenará después de la filmación y la conexión de datos."}, "Local tips will be added after our filming.": {"ja": "ローカルなヒントは私たちの撮影の後追加されます。", "zh": "拍摄完成后会添加当地提示。", "tw": "我們拍攝完成後會加入當地小提示。", "es": "Se agregarán consejos locales después de nuestra filmación."}, "The main royal palace of the Joseon dynasty, built in 1395.": {"ja": "チョソン王朝の主要な王宮で、1395年に建てられた。", "zh": "朝鲜王朝的主要皇宫，建于1395年。", "tw": "朝鮮王朝的主要皇宮，建於1395年。", "es": "El principal palacio real de la dinastía Joseon, construido en 1395."}, "Visitors wearing hanbok enter for free. Check the current rules before you go.": {"ja": "はんぼくを着用している訪問者は無料で入場できます。行く前に現在の規則を確認してください。", "zh": "穿着韩服的游客可以免费入场，在去之前请先查看当前的规则。", "tw": "穿著韓服的遊客可以免費入場，請在出發前先確認目前的規定。", "es": "Los visitantes que llevan hanbok entran de forma gratuita. Verifica las reglas actuales antes de ir."}, "A residential area of traditional hanok houses.": {"ja": "伝統的なハノクの家が並ぶ住宅街です。", "zh": "传统韩屋住宅区", "tw": "傳統韓屋的住宅區域", "es": "Un área residencial de casas hanok tradicionales."}, "People live here. Keep your voice down and be considerate when taking photos.": {"ja": "ここには人々が住んでいますので、声の大きさを抑え、写真を撮る際にも配慮してください。", "zh": "这里有人居住，请降低声音，并在拍照时注意不要打扰他人。", "tw": "這裡有人居住，請降低聲音並在拍照時注意他人。", "es": "La gente vive aquí, por favor mantén la voz baja y sé considerado al tomar fotos."}, "An observation tower on top of Namsan.": {"ja": "ナムサンの頂上にある展望塔です。", "zh": "南山山顶的观景塔", "tw": "南山山頂的觀景塔", "es": "Una torre de observación en la cima de Namsan."}, "A traditional market known for its food alleys.": {"ja": "伝統的な市場で、食べ物の小径で有名です。", "zh": "一个以美食小巷闻名的传统市场。", "tw": "一個以美食小巷聞名的傳統市場。", "es": "Un mercado tradicional conocido por sus calles de comida."}, "Payment methods differ by stall. Ask whether cards are accepted before you order.": {"ja": "支払い方法は店によって異なります。注文する前にカードが利用できるかどうかを聞いてください。", "zh": "每个摊位的付款方式都不同，请在点餐前先询问是否接受卡付。", "tw": "攤位的付款方式各有不同，在點餐前請先詢問是否接受信用卡付款。", "es": "Los métodos de pago varían según el puesto, así que pregunte si se aceptan tarjetas antes de pedir."}, "A fortress built under King Jeongjo, listed as a UNESCO World Heritage Site.": {"ja": "ジョンジョ王の時代に造られた城塞で、ユネスコの世界遺産にも登録されている。", "zh": "在正祖王统治期间建造的堡垒，被列为联合国教科文组织世界遗产。", "tw": "由正祖王所建造的堡壘，被列為聯合國教科文組織世界遺產。", "es": "Una fortaleza construida bajo el rey Jeongjo, incluida en la lista de sitios Patrimonio de la Humanidad de la UNESCO."}, "Gangwon’s signature national park, with scenery that changes by season.": {"ja": "江原道のシグネチャーな国立公園で、四季によって変化する風景です。", "zh": "江原道的标志性国家公园，随着季节变化的风景。", "tw": "江原道的標誌性國家公園，隨著季節變化而呈現不同的風景。", "es": "El parque nacional insignia de Gangwon, con un paisaje que cambia según la estación."}, "A street of cafés facing the /* dark recolor of the OpenFreeMap "positron" style so roads and buildings read on the night theme */
function darkStyle(st){
 var FILL={park:'#D9E8D2',water:'#CBE0E8',landcover_wood:'#D3E5CB',landuse_residential:'#F1EEE4','aeroway-area':'#E4E6DF',road_area_pier:'#F1EEE4',building:'#E2DDCF'};
 st.layers=st.layers.filter(function(l){return !/^(highway-shield|road_shield)/.test(l.id);});
 st.layers.forEach(function(l){var p=l.paint||(l.paint={}),id=l.id,ly=l.layout||(l.layout={});
  if(l.type==='background'){p['background-color']=['interpolate',['linear'],['zoom'],5,'#DFDCD0',10.5,'#F2EFE5'];}
  else if(l.type==='fill'){p['fill-color']=FILL[id]||'#F2EFE5';
   if(id==='building'){l.minzoom=15;p['fill-outline-color']='#D3CDBB';p['fill-opacity']=['interpolate',['linear'],['zoom'],15,.0,16,.9];}
   else if(p['fill-outline-color'])p['fill-outline-color']=p['fill-color'];}
  else if(l.type==='line'){var c;
   if(id==='boundary_3'){ly.visibility='none';return;}
   if(/^boundary/.test(id))c='#9DB0A8';
   else if(/railway/.test(id)){ly.visibility='none';return;}
   else if(/casing/.test(id))c='#E6E1D2';
   else if(/subtle/.test(id)){ly.visibility='none';return;}
   else if(/motorway/.test(id))c='#F6C9A8';
   else if(/major/.test(id))c='#FFFFFF';
   else if(/minor|service/.test(id)){c='#FFFFFF';if(!l.minzoom||l.minzoom<14)l.minzoom=14;}
   else if(/path|pier/.test(id)){ly.visibility='none';return;}
   else if(/waterway/.test(id))c='#B9D3DE';
   else if(/aeroway/.test(id))c='#E2E4DC';
   else c='#FFFFFF';
   p['line-color']=c;}
  else if(l.type==='symbol'){
   p['text-color']=/water/.test(id)?'#5E8FA3':/country|state/.test(id)?'#183235':'#3E5658';
   p['text-halo-color']='#F6F3EA';p['text-halo-width']=1.8;p['text-halo-blur']=.3;
   if(/^(label_|airport)/.test(id))delete ly['icon-image'];
   if(/poi|transit|airport|housenumber|aerodrome|rail/.test(id)){ly.visibility='none';}
   if(/^label_(country|state)/.test(id)){ly.visibility='none';return;}
   if(id==='label_village'||id==='label_other')l.minzoom=13;else if(id==='label_town')l.minzoom=11.5;else if(id==='label_city')l.minzoom=9;else if(/highway-name/.test(id))l.minzoom=14;}
 });
 return st;
}

function markNav(){
 var y=window.innerHeight*.35,cur=TABS[0][0];
 TABS.forEach(function(x){var el=document.getElementById(x[0]);if(el&&el.getBoundingClientRect().top<=y)cur=x[0];});

}

/* search */
function searchRun(){
 var q=$('#q').value.trim().toLowerCase(),box2=$('#sres');
 if(!q){box2.hidden=true;return;}
 var out=[];
 var sk=/학교|대학|university|college|campus|school|大学|大學|universidad/i.test(q);
 {for(var s=0;s<ITEMS.length&&out.length<(sk?8:4);s++){var si=ITEMS[s];if(si.cat!=='school')continue;var sa=((si.ko||'')+' '+(si.en||'')).toLowerCase();if(sa.indexOf(q)>=0||(q.length>=2&&/학교|대학|university|college|campus|school/.test(q)))out.push(s);}}
 for(var i=0;i<ITEMS.length&&out.length<8;i++){if(out.indexOf(i)>=0)continue;var it=ITEMS[i],a=((it.p?pick(it.p.n):'')+' '+(it.ko||'')+' '+(it.en||'')+' '+regName(it.reg)).toLowerCase();if(it.p){a+=' '+it.p.n.join(' ').toLowerCase();}if(a.indexOf(q)>=0)out.push(i);}
 var h='';out.forEach(function(i){var it=ITEMS[i];h+='<button type="button" data-i="'+i+'"><i style="--c:var(--c-'+it.cat+')"></i><span>'+esc(itName(it))+'</span><em>'+esc(regName(it.reg))+'</em></button>';});
 box2.innerHTML=h||'<button type="button" disabled><span>'+esc(t('srchNone'))+'</span></button>';box2.hidden=false;
}

/* community board */
var BD={posts:[],sort:'new',open:{},tr:{},ok:false},ownT={};
try{ownT=JSON.parse(localStorage.getItem('pk-own')||'{}')||{};}catch(e){ownT={};}
function saveOwn(){try{localStorage.setItem('pk-own',JSON.stringify(ownT));}catch(e){}}
function bApi(path,body){return fetch('/api/board'+path,body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'err');return j;});});}
function bErrMsg(e){var m=String(e&&e.message||'');return m==='link'?t('bErrLink'):m==='short'?t('bErrShort'):m==='rate'?t('bErrRate'):t('bErr');}
function loadBoard(){bApi('/list?sort='+BD.sort).then(function(j){BD.posts=j.posts||[];BD.ok=true;renderBoard();}).catch(function(){BD.ok=false;$('#blist').innerHTML='<p class="bnote">'+esc(t('bLoadErr'))+'</p>';});}
function bDate(ts){try{return new Date(ts).toLocaleDateString(lang==='tw'?'zh-TW':lang==='zh'?'zh-CN':lang);}catch(e){return '';}}
function detLang(x){return /[가-힣]/.test(x)?'ko':/[぀-ヿ]/.test(x)?'ja':/[一-鿿]/.test(x)?'zh':/[ñáéíóúü¿¡]/i.test(x)?'es':'en';}
function renderBoardStatic(){
 $('#bT').textContent=t('boardT');$('#bL').textContent=t('boardL');
 $('#bNickI').placeholder=t('bNick');$('#bPlaceI').placeholder=t('bPlace');$('#bTextI').placeholder=t('bText');$('#bSendB').textContent=t('bSend');$('#bRule').textContent=t('bRule');
 $('#bsort').innerHTML='<button type="button" data-s="new" aria-pressed="'+(BD.sort==='new')+'">'+esc(t('bNew'))+'</button><button type="button" data-s="top" aria-pressed="'+(BD.sort==='top')+'">'+esc(t('bTop'))+'</button>';
 $('#ctaBoardT').textContent=t('bGo');
}
function renderBoard(){
 if(!BD.ok)return;var h='';
 if(!BD.posts.length)h='<p class="bnote">'+esc(t('bEmpty'))+'</p>';
 BD.posts.forEach(function(p){
  var mine=!!ownT['p'+p.id],op=!!BD.open[p.id];
  h+='<article class="bpost" data-id="'+p.id+'"><span class="pl">'+esc(p.place)+'</span><p class="who">'+esc(p.nick)+' · '+esc(bDate(p.ts))+'</p><p class="bd">'+esc(p.body)+'</p>'+(BD.tr[p.id]?'<p class="tr">'+esc(BD.tr[p.id])+'</p>':'');
  h+='<div class="bact"><button type="button" class="lk" data-a="like" aria-pressed="'+!!p.liked+'">♥ '+esc(t('bLike'))+' '+(p.likes||0)+'</button><button type="button" data-a="rep">'+esc(t('bReply'))+' '+p.replies.length+'</button><button type="button" class="sm" data-a="tr">'+esc(t('bTr'))+'</button>'+(mine?'<button type="button" class="sm" data-a="del">'+esc(t('bDel'))+'</button>':'<button type="button" class="sm" data-a="rpt">'+esc(t('bReport'))+'</button>')+'</div>';
  if(op){h+='<div class="brep">';p.replies.forEach(function(r){var rm=!!ownT['r'+r.id];h+='<div><p>'+esc(r.body)+'</p><small>'+esc(r.nick)+' · '+esc(bDate(r.ts))+(rm?' · <button type="button" class="sm" data-a="rdel" data-rid="'+r.id+'" style="border:0;background:none;color:var(--accenttext);padding:0;font-size:12px">'+esc(t('bDel'))+'</button>':'')+'</small></div>';});
   h+='<form class="rform" data-pid="'+p.id+'"><input maxlength="400" type="text" placeholder="'+esc(t('bReplyPh'))+'" required><button type="submit">'+esc(t('bReply'))+'</button></form></div>';}
  h+='</article>';});
 $('#blist').innerHTML=h;
}
function nickVal(){var n=$('#bNickI').value.trim();try{if(n)localStorage.setItem('pk-nick',n);}catch(e){}return n;}
(function(){try{var n=localStorage.getItem('pk-nick');if(n)$('#bNickI').value=n;}catch(e){}})();
$('#bform').addEventListener('submit',function(e){e.preventDefault();var m=$('#bMsg'),btn=$('#bSendB');btn.disabled=true;m.textContent='';
 bApi('/post',{nick:nickVal(),place:$('#bPlaceI').value,text:$('#bTextI').value}).then(function(j){ownT['p'+j.id]=j.token;saveOwn();$('#bPlaceI').value='';$('#bTextI').value='';m.textContent=t('bThanks');BD.sort='new';renderBoardStatic();loadBoard();})
 .catch(function(er){m.textContent=bErrMsg(er);}).then(function(){btn.disabled=false;});});
$('#bsort').addEventListener('click',function(e){var b=e.target.closest('button[data-s]');if(!b)return;BD.sort=b.getAttribute('data-s');renderBoardStatic();loadBoard();});
$('#blist').addEventListener('click',function(e){
 var b=e.target.closest('button[data-a]');if(!b)return;var art=b.closest('.bpost'),id=+art.getAttribute('data-id'),a=b.getAttribute('data-a'),p=BD.posts.filter(function(x){return x.id===id;})[0];
 if(a==='like'){bApi('/like',{postId:id}).then(function(j){p.liked=j.liked;p.likes=j.likes;renderBoard();}).catch(function(er){toast(bErrMsg(er));});}
 else if(a==='rep'){BD.open[id]=!BD.open[id];renderBoard();}
 else if(a==='tr'){if(BD.tr[id]){delete BD.tr[id];renderBoard();return;}var from=detLang(p.body),to=lang;if(from===to||(from==='zh'&&(to==='tw'||to==='zh'))&&false){BD.tr[id]=p.body;renderBoard();return;}
  translate(p.body.slice(0,400),from,to).then(function(o){BD.tr[id]=o;renderBoard();}).catch(function(){toast(pk2(S.trFail));});}
 else if(a==='del'){bApi('/delete',{kind:'post',id:id,token:ownT['p'+id]}).then(function(){delete ownT['p'+id];saveOwn();loadBoard();}).catch(function(er){toast(bErrMsg(er));});}
 else if(a==='rdel'){var rid=b.getAttribute('data-rid');bApi('/delete',{kind:'reply',id:+rid,token:ownT['r'+rid]}).then(function(){delete ownT['r'+rid];saveOwn();loadBoard();}).catch(function(er){toast(bErrMsg(er));});}
 else if(a==='rpt'){bApi('/report',{kind:'post',id:id}).then(function(){toast(t('bThanks'));}).catch(function(){});}
});
$('#blist').addEventListener('submit',function(e){var f=e.target.closest('.rform');if(!f)return;e.preventDefault();var pid=+f.getAttribute('data-pid'),inp=f.querySelector('input');
 bApi('/reply',{postId:pid,nick:nickVal(),text:inp.value}).then(function(j){ownT['r'+j.id]=j.token;saveOwn();BD.open[pid]=true;loadBoard();}).catch(function(er){toast(bErrMsg(er));});});

/* overlays */

 if(e.target.id==='sosPhrBtn'){closeSOS();var el=$('#sec-phr');el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});}});
function showBigQ(q){var tx=lang==='ko'?q[1]:(phText(q[2])||q[2]);
 $('#showOv').innerHTML='<div class="bk">'+esc(q[0])+'</div><div class="bt">'+esc(tx)+'</div><button type="button" id="bigClose">'+esc(t('close'))+'</button>';

/* ---------- live interpreter (Web Speech API + /api/translate on Cloudflare Workers AI) ---------- */
var ILANGS=[['en','English','en-US','en'],['ja','日本語','ja-JP','ja'],['zh','简体中文','zh-CN','zh'],['tw','繁體中文','zh-TW','tw'],['es','Español','es-ES','es']];
var myL=lang==='ko'?'en':lang;try{var ml=localStorage.getItem('pk-my');if(ml&&ILANGS.some(function(x){return x[0]===ml;}))myL=ml;}catch(e){}
function IL(c){for(var i=0;i<ILANGS.length;i++)if(ILANGS[i][0]===c)return ILANGS[i];return ILANGS[0];}
var ilog=[],rec=null;
function gotoInterp(){var el=$('#sec-interp');el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});}
function speak(text,bcp){try{if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){toast(pk2(S.noSpeech));return;}
 var u=new SpeechSynthesisUtterance(text);u.lang=bcp;var vs=window.speechSynthesis.getVoices()||[];
 var v=vs.filter(function(x){return x.lang&&x.lang.replace('_','-')===bcp;})[0]||vs.filter(function(x){return x.lang&&x.lang.slice(0,2)===bcp.slice(0,2);})[0];if(v)u.voice=v;
 window.speechSynthesis.cancel();window.speechSynthesis.speak(u);}catch(e){toast(pk2(S.noSpeech));}}
function translate(text,from,to){return fetch('/api/translate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:text,from:from,to:to})}).then(function(r){return r.json().then(function(j){if(!r.ok||!j.text)throw new Error(j.error||'fail');return j.text;});});}
function renderLog(){var el=$('#ilog');
 if(!ilog.length){el.innerHTML='<p class="iempty">'+esc(t('ipEmpty'))+'</p>';return;}
 var h='';ilog.forEach(function(m,i){
  h+='<div class="msg '+m.dir+'"><div class="mo">'+esc(m.src)+'</div><div class="mt">'+(m.busy?'…':m.err?'<span class="merr">'+esc(pk2(S.trFail))+'</span>':esc(m.out))+'</div>';
  if(m.out)h+='<div class="ma"><button type="button" data-a="say" data-i="'+i+'">'+esc(t('listen'))+'</button><button type="button" data-a="big" data-i="'+i+'">'+esc(t('show'))+'</button></div>';
  h+='</div>';});
 el.innerHTML=h;el.scrollTop=el.scrollHeight;}
function outBcp(m){return m.dir==='me'?'ko-KR':IL(myL)[2];}
function addMsg(dir,text){
 var m={dir:dir,src:text,out:null,busy:true,err:false};ilog.push(m);if(ilog.length>40)ilog.shift();renderLog();
 var from=dir==='me'?IL(myL)[3]:'ko',to=dir==='me'?'ko':IL(myL)[3];
 translate(text,from,to).then(function(o){m.out=o;m.busy=false;renderLog();if($('#iauto').checked&&dir==='me')speak(o,'ko-KR');})
 .catch(function(){m.busy=false;m.err=true;renderLog();});
}
function setMic(dir){$('#micMe').classList.toggle('rec',dir==='me');$('#micKo').classList.toggle('rec',dir==='ko');}
var recT=0,recMax=0;
function stopMic(){clearTimeout(recT);clearTimeout(recMax);if(rec){var r=rec;rec=null;r.onresult=r.onerror=r.onend=null;try{r.abort();}catch(e){}}setMic(null);$('#ilive').textContent='';}
function listen(dir){
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){toast(pk2(S.noMic));$('#iin').focus();return;}
 if(rec){var cur=rec;try{cur.stop();}catch(e){stopMic();}return;}
 var r=new SR(),fin='',live=$('#ilive');rec=r;
 r.lang=dir==='ko'?'ko-KR':IL(myL)[2];r.interimResults=true;r.continuous=false;
 r.onresult=function(e){var s2='';for(var i=0;i<e.results.length;i++){s2+=e.results[i][0].transcript;}fin=s2;live.textContent=s2;
  clearTimeout(recT);recT=setTimeout(function(){try{r.stop();}catch(x){stopMic();}},1800);};
 r.onerror=function(e){if(e.error==='not-allowed'||e.error==='service-not-allowed')toast(pk2(S.micDenied));};
 r.onend=function(){clearTimeout(recT);clearTimeout(recMax);var had=fin.trim();rec=null;setMic(null);live.textContent='';if(had)addMsg(dir,had);};
 try{r.start();setMic(dir);live.textContent='…';recMax=setTimeout(function(){try{r.stop();}catch(x){stopMic();}},12000);}catch(e){stopMic();}
}
document.addEventListener('visibilitychange',function(){if(document.hidden){stopMic();try{window.speechSynthesis.cancel();}catch(e){}}});
window.addEventListener('pagehide',function(){stopMic();try{window.speechSynthesis.cancel();}catch(e){}});
$('#micMe').addEventListener('click',function(){listen('me');});
$('#micKo').addEventListener('click',function(){listen('ko');});
$('#itext').addEventListener('submit',function(e){e.preventDefault();var v=$('#iin').value.trim();if(!v)return;$('#iin').value='';addMsg(/[ㄱ-ㆎ가-힣]/.test(v)?'ko':'me',v);});
$('#ilog').addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var m=ilog[+b.getAttribute('data-i')];if(!m||!m.out)return;
 if(b.getAttribute('data-a')==='say')speak(m.out,outBcp(m));
 else{$('#showOv').innerHTML='<div class="bk">'+esc(m.out)+'</div><div class="bt">'+esc(m.src)+'</div><button type="button" id="bigClose">'+esc(t('close'))+'</button>';$('#showOv').hidden=false;$('#bigClose').focus();}});
(function(){var s=$('#myLang'),h='';ILANGS.forEach(function(l){h+='<option value="'+l[0]+'">'+l[1]+'</option>';});s.innerHTML=h;s.value=myL;
 s.addEventListener('change',function(){myL=s.value;try{localStorage.setItem('pk-my',myL);}catch(e){}applyInterp();});})();
function applyInterp(){
 $('#ipT').textContent=t('ipT');$('#ipL').textContent=t('ipL');
 $('#micMeT').textContent=t('ipMe')+' · '+IL(myL)[1];$('#micKoT').textContent=t('ipKo');
 $('#iin').placeholder=t('ipPh');$('#isend').textContent=t('ipSend');$('#ipAuto').textContent=t('ipAuto');
 $('#ipMyLbl').textContent=t('ipMyLang');$('#ipNote').textContent=pk2(S.ipNote);
 $('#ctaInt').lastChild.textContent=t('ipCta');$('#zint').setAttribute('aria-label',t('ipT'));$('#zint').title=t('ipT');

$('#mapFail').textContent=pk2(S.mapFail);

(function(){var s=$('#lang'),h='';LANGS.forEach(function(l){h+='<option value="'+l[0]+'">'+l[1]+'</option>';});s.innerHTML=h;s.value=lang;
 s.addEventListener('change',function(){lang=s.value;try{localStorage.setItem('pk-lang',lang);}catch(e){}applyLang();});})();

/* boot */
buildPins();
computeCache();
applyLang();
loadBoard();
layout();
initMap();
startWatch();
fetch('tour.json').then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){
 var R=j.regs,C=j.cats;j.d.forEach(function(r){addItem({lon:r[0],lat:r[1],cat:C[r[2]],ko:r[3],en:r[4],addr:r[5],reg:R[r[6]],cid:r[7],img:r[8]});});
 var F=j.feat||{};Object.keys(F).forEach(function(id){if(pIdx[id]!==undefined)ITEMS[pIdx[id]].p.img=F[id];});renderSections();loadNow();
 fetch('details.json').then(function(r){return r.ok?r.json():null;}).then(function(d){DET=d;if(sel!==null)renderSheet(true);}).catch(function(){});
 loadState='ok';computeCache();renderChip();renderLegend();updateRegLabels();render();
 fetch('schools.json').then(function(r){return r.ok?r.json():[];}).then(function(a){a.forEach(function(r,i){addItem({lon:r[0],lat:r[1],cat:'school',ko:r[2],en:r[3],addr:'',reg:r[4],cid:'sc'+i});});computeCache();renderLegend();render();}).catch(function(){});
}).catch(function(){loadState='fail';renderChip();toast(pk2(S.loadFail));});
if(window.ResizeObserver){new ResizeObserver(function(){layout();}).observe(box);}else{window.addEventListener('resize',layout);}
})();
