:root{
  --bg:#F5F3ED;--surface:#FFFEFA;--surface2:#EDEFE9;--fg:#183235;--muted:#647979;--line:#E1E5DF;
  --accent:#E94F3D;--accenttext:#B74A3D;--sos:#E94F3D;--sage:#91B5A8;--mint:#DCECE5;
  --c-sight:#D83A2E;--c-food:#C77D00;--c-stay:#2C5BD4;--c-store:#168A5C;--c-gov:#3B4350;--c-transit:#0C8CA6;--c-event:#A83A86;--c-shop:#7A4FD6;
  --glyph:#FFFFFF;--pinedge:#FFFFFF;--shadow:0 18px 55px rgba(24,50,53,.09);
  --night:#08141D;
  --fontb:"Pretendard","Pretendard Variable",system-ui,-apple-system,"Apple SD Gothic Neo","Hiragino Sans","PingFang SC","PingFang TC","Microsoft YaHei","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--fontb);font-size:16px;line-height:1.5;margin:0;padding-block:0 0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* night scope: header + hero + map keep one dark look in every theme */
.night{--surface:#122230;--surface2:#1B3144;--fg:#EAF3F8;--muted:#A3BBC9;--line:#2C4558;
  --accent:#FF4A3D;--accenttext:#FF7A6F;--glyph:#0B1416;--pinedge:#08141D;
  --c-sight:#FF6A5C;--c-food:#FFB627;--c-stay:#6E93FF;--c-store:#3ECF94;--c-gov:#A9B5C8;--c-transit:#36C8E0;--c-event:#E070BC;--c-shop:#B58CFF;
  background:var(--night);color:var(--fg);color-scheme:dark}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(245,243,237,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:9px 0}
.row1{display:flex;align-items:center;gap:10px}
.langw{display:flex;align-items:center;gap:6px;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 6px 0 12px;min-height:42px}
.langw svg{flex:none}
#lang{background:transparent;border:0;color:var(--fg);min-height:40px;font-weight:700;max-width:118px;padding:0 2px;font-size:14px}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;justify-content:center;text-decoration:none;color:var(--fg)}
.wm{font-weight:850;font-size:16px;letter-spacing:.07em;white-space:nowrap}
.wm span{color:var(--accent)}
.sos{flex:none;background:var(--sos);color:#fff;border:0;border-radius:999px;font-weight:800;min-height:42px;padding:0 16px;letter-spacing:.04em}
.tabs{display:none}
.hero{padding:28px 0 10px}
.eyebrow{color:var(--accenttext);text-transform:uppercase;letter-spacing:.16em;font-weight:850;font-size:11px}
.h1{margin:12px 0 12px;font-weight:850;font-size:clamp(40px,11vw,68px);line-height:1;letter-spacing:-.045em;text-wrap:balance}
.h1 span{color:var(--accent);display:block}
.heroQ{display:inline-block;margin:2px 0 14px;padding:8px 16px;border-radius:999px;background:var(--fg);color:var(--bg);font-weight:850;font-size:clamp(16px,4.6vw,20px);letter-spacing:-.01em}
.heroP{max-width:46ch;color:var(--muted);margin:0 0 18px;font-size:16px}
.search{position:relative;display:flex;max-width:520px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.search svg{flex:none;margin:12px 4px 0 10px;color:var(--muted)}
.search input{border:0;outline:0;background:transparent;min-width:0;flex:1;font:inherit;font-size:15px;color:var(--fg);padding:0 8px;min-height:44px}
.search button{border-radius:11px;background:var(--fg);color:#fff;font-weight:750;padding:0 18px;min-height:44px;border:0}
.sres{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:340px;overflow:auto}
.sres button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 14px;min-height:48px}
.sres button:first-child{border-top:0}
.sres i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.sres span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sres em{font-style:normal;color:var(--muted);font-size:12.5px}
.micro{color:#869492;font-size:12px;margin:10px 0 0}
.cta{display:flex;margin:14px 0 0}
.cta button{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;border:1px solid var(--accent);background:transparent;color:var(--accenttext);font-weight:800;font-size:15px}
.mapsec{padding:14px 0 0;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 64px)}

/* map */
.mapbox{color:var(--fg);position:relative;height:clamp(500px,76vh,760px);border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#EEEBE0;user-select:none;-webkit-user-select:none;box-shadow:0 0 0 1px rgba(255,255,255,.03),0 18px 50px rgba(24,50,53,.12)}
#gl.gl{position:absolute;inset:0;width:100%;height:100%}
.maplibregl-ctrl-attrib{background:rgba(255,254,250,.8)!important;color:#647979!important;font-size:11px}
.maplibregl-ctrl-attrib a{color:#CFE3EE!important}
.mapfail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#CFE3EE;z-index:2}
.pins{position:absolute;inset:0;pointer-events:none}
.pins>*{pointer-events:auto}
.rpin{position:absolute;left:0;top:0;display:none;align-items:center;gap:6px;background:rgba(255,254,250,.94);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 7px;font-size:12.5px;font-weight:600;line-height:1.2;white-space:nowrap;box-shadow:0 2px 8px rgba(24,50,53,.14);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.rpin svg{flex:none;width:14px;height:18px;display:block}
.rpin .pg{fill:#B9C4C0}
.rpin .pd{fill:#183235}
.rpin i{font-style:normal;font-variant-numeric:tabular-nums;font-size:11.5px;opacity:.8}

var TR2={"Prototype · descriptions and rankings are samples until public data is connected.": {"ja": "プロトタイプ・説明およびランキングは、パブリックデータが接続されるまでのサンプルです。", "zh": "原型 · 描述和排名是样本，直到连接公共数据。", "tw": "原型 · 描述和排名在連接公開資料之前僅供參考。", "es": "Prototipo · las descripciones y clasificaciones son muestras hasta que se conecten los datos públicos."}, "Dashed lines are province borders. Zoom in to see city borders. Pin colors show the type.": {"ja": "破線は省の境界線です。市の境界線を見るにはズームインしてください。ピンの色は種類を示しています。", "zh": "虚线代表省界，放大即可看到城市边界，针颜色代表类型", "tw": "虛線代表省界，放大即可看到城市界限，釘子顏色代表類型。", "es": "Las líneas discontinuas son fronteras de provincia. Amplíe para ver las fronteras de la ciudad. Los colores de los marcadores muestran el tipo."}, "Prototype: saved on this device only.": {"ja": "このデバイスのみに保存されています。", "zh": "仅保存在此设备上。", "tw": "原型：僅儲存在此裝置中。", "es": "Prototipo: guardado solo en este dispositivo."}, "Shown after data is connected": {"ja": "データが接続された後に表示されます", "zh": "连接数据后显示", "tw": "連接資料後顯示", "es": "Se muestra después de que se conectan los datos"}, "YouTube, Instagram and TikTok links will appear here after filming.": {"ja": "YouTube、Instagram、TikTokのリンクは、撮影後こちらに掲載されます。", "zh": "YouTube，Instagram和TikTok的链接将在拍摄后出现在这里。", "tw": "YouTube、Instagram和TikTok的連結將在拍攝完成後出現在這裡。", "es": "Enlaces de YouTube, Instagram y TikTok aparecerán aquí después de la filmación."}, "Sample picks. They will be replaced by tourism-agency event data and our crew’s recommendations.": {"ja": "サンプルのピックです。これらは観光局のイベントデータや私たちのクルーのお勧めに置き換えられます。", "zh": "示例选项，将会被旅游机构的活动数据和我们的工作人员推荐所取代", "tw": "範例選項，將會被替換為旅遊社的活動資料和我們團隊的推薦。", "es": "Selecciones de ejemplo. Serán reemplazadas por datos de eventos de la agencia de turismo y las recomendaciones de nuestro equipo."}, "At launch this section starts with visit notes from the PINNED KOREA crew. Traveler reviews open once there are users.": {"ja": "開始時にこのセクションはPINNED KOREAクルーの訪問ノートから始まります。ユーザーがいる場合、旅行者のレビューが開きます。", "zh": "启动时，该板块首先显示PINNED KOREA团队的访问笔记，一旦有用户后就会开放旅行者评论。", "tw": "啟動時，這個板塊先顯示PINNED KOREA團隊的遊記，當有用戶留言後，將開放旅客評論。", "es": "Al lanzamiento esta sección comienza con notas de visita del equipo PINNED KOREA. Las reseñas de los viajeros se abren una vez que hay usuarios."}, "Review text appears here.": {"ja": "レビューのテキストがここに表示されます。", "zh": "评论文字显示在这里。", "tw": "評論文字出現在這裡。", "es": "El texto de la reseña aparece aquí."}, "Visited pin · Reviewer’s country": {"ja": "訪問したピン · レビュアーの国", "zh": "访问过的地点 · 评论者所在国家", "tw": "參觀過的評分 · 評論者所在國家", "es": "Visitó pin · País del revisor"}, "Pick a country to see where its visitors go.": {"ja": "国を選んで、その国に訪れる人の行き先を見てみましょう。", "zh": "选择一个国家来看看它的游客会去哪里。", "tw": "選一個國家來看看它的遊客會去哪裡。", "es": "Elige un país para ver a dónde van sus visitantes."}, "Sample ranking. It will switch to real figures, with sources, once official statistics are connected.": {"ja": "サンプルランキングです。公式統計が接続されると、実際の数字と出典に切り替わります。", "zh": "样本排名，一旦官方统计数据连接后，将会切换到真实数据，并附上来源。", "tw": "排名樣本，將在官方統計數據連接後，切換為真實數據，並附上來源。", "es": "Clasificación de muestra. Cambiará a cifras reales, con fuentes, una vez que se conecten las estadísticas oficiales."}, "Only figures from trusted public agencies go here, kept separate from our own picks (Top 5).": {"ja": "信頼できる公的機関からの数字のみがこちらに記載され、当社の独自のピック（トップ5）とは別々に保管されます。", "zh": "这里只列出来自可靠的公共机构的数据，与我们自己的选择（前5名）分开。", "tw": "只有來自值得信賴的公共機構的數據才能放在這裡，並且與我們自己的選擇（前5名）分開。", "es": "Solo las cifras de agencias públicas de confianza van aquí, manteniéndolas separadas de nuestras propias selecciones (Top 5)."}, "Languages other than English are machine-translated and load the first time you open a situation.": {"ja": "英語以外の言語は機械翻訳されており、状況を開いた最初の時に読み込まれます。", "zh": "除了英语以外的语言是通过机器翻译的，并且在您第一次打开某个情况时加载。", "tw": "除英語以外的語言是透過機器翻譯，在您第一次開啟情境時載入。", "es": "Los idiomas distintos del inglés se traducen automáticamente y se cargan la primera vez que abres una situación."}, "Sound playback isn’t available here.": {"ja": "ここでは音声の再生は利用できません。", "zh": "这里无法播放声音。", "tw": "這裡無法播放聲音。", "es": "La reproducción de sonido no está disponible aquí."}, "Numbers are for the prototype and will be re-checked before launch. If the call button does nothing, dial the number yourself.": {"ja": "はプロトタイプ用の番号で、発売前に再確認されます。如果ボタンを押しても何も起こらない場合、番号を自分でダイヤルしてください。", "zh": "数字只是用于原型测试，在正式发布前会重新核对，如果呼叫按钮无反应，可以自己直接拨打电话号码。", "tw": "數字是為了原型而設，將在發佈前重新核對。如果呼叫按鈕無法使用，請自行撥打電話號碼。", "es": "Los números son para el prototipo y se volverán a verificar antes del lanzamiento. Si el botón de llamada no hace nada, marca el número tú mismo."}, "Loading places from Korea Tourism Organization…": {"ja": "韓国観光公社から場所を読み込み中…", "zh": "正在从韩国旅游组织加载景点信息…", "tw": "從韓國觀光公社載入景點…", "es": "Cargando lugares de la Organización de Turismo de Corea…"}, "Source: Korea Tourism Organization (TourAPI)": {"ja": "韓国観光公社（TourAPI）", "zh": "来源：韩国旅游组织（TourAPI）", "tw": "來源：韓國觀光公社（TourAPI）", "es": "Organización de Turismo de Corea (TourAPI)"}, "Couldn’t load tourism data. Showing sample pins only.": {"ja": "観光データの読み込みに失敗しました。サンプルのピンだけを表示しています。", "zh": "无法加载旅游数据，只显示样本标记。", "tw": "無法載入旅遊資料，目前只顯示示範標籤。", "es": "No se pudo cargar los datos de turismo. Se muestran solo los puntos de muestra."}, "Official listing": {"ja": "公式の掲載", "zh": "正式列表", "tw": "官方列表", "es": "Lista oficial"}, "Zoom in": {"ja": "拡大してください", "zh": "放大", "tw": "放大", "es": "Ampliar"}, "Zoom out": {"ja": "ズームアウトしてください", "zh": "拉远镜头", "tw": "拉遠鏡頭", "es": "Aleja la cámara"}, "Reset map": {"ja": "マップをリセットしてください", "zh": "重置地图", "tw": "重設地圖", "es": "Reiniciar mapa"}, "Photo: Korea Tourism Organization": {"ja": "フォト: 韓国観光公社", "zh": "照片：韩国旅游组织", "tw": "照片：韓國觀光公社", "es": "Foto: Organización de Turismo de Corea"}, "Map could not be loaded. Please check your connection and reload.": {"ja": "マップを読み込むことができませんでした。接続を確認して再読み込みしてください。", "zh": "地图无法加载，请检查您的网络连接并重新加载。", "tw": "地圖無法載入，請檢查您的連線並重新載入。", "es": "No se pudo cargar el mapa. Por favor, verifique su conexión y vuelva a cargar."}, "Beta. Translations are machine-made, so double-check anything important (medical, contracts). If the mic does nothing, open this page in Chrome or Safari.": {"ja": "ベータです。翻訳は機械で行われるため、重要な情報（医療、契約書など）については、必ず再確認してください。マイクが反応しない場合は、このページをChromeまたはSafariで開いてください。", "zh": "Beta翻译是由机器生成的，因此对于重要信息（如医疗或合同），请务必再次核实。如果麦克风不工作，请在Chrome或Safari中打开此页面。", "tw": "Beta，翻譯是由機器製作的，因此對於重要資訊（如醫療或合約）請再次確認。如果麥克風無法使用，請在Chrome或Safari瀏覽器中開啟此頁面。", "es": "Beta. Las traducciones son generadas por máquina, así que verifique cualquier cosa importante (médica, contratos). Si el micrófono no funciona, abra esta página en Chrome o Safari."}, "This browser doesn’t support speech recognition. Please type instead.": {"ja": "このブラウザは音声認識をサポートしていません。代わりにタイプしてください。", "zh": "这个浏览器不支持语音识别，请改用输入法。", "tw": "這個瀏覽器不支援語音辨識，請改用鍵盤輸入。", "es": "Este navegador no admite reconocimiento de voz. Por favor, escriba en su lugar."}, "Please allow microphone access.": {"ja": "マイクへのアクセスを許可してください。", "zh": "请允许使用麦克风权限。", "tw": "請允許麥克風存取。", "es": "Por favor, permita el acceso al micrófono."}, "Translation failed. Please try again.": {"ja": "翻訳に失敗しました。再度試してください。", "zh": "翻译失败，请再试一次。", "tw": "翻譯失敗，請再試一次。", "es": "La traducción ha fallado. Por favor, inténtelo de nuevo."}, "Save your pins with Google or Apple sign-in": {"ja": "GoogleまたはAppleのサインインでピンを保存する", "zh": "使用谷歌或苹果账号登录保存您的收藏", "tw": "使用Google或Apple登入來儲存您的PIN碼", "es": "Guarda tus pines con inicio de sesión de Google o Apple"}, "“PINNED KOREA verified” photo cards": {"ja": "PINNED KOREA 認証済み 写真カード", "zh": "PINNED KOREA 已验证 的照片卡", "tw": "PINNED KOREA 驗證照片卡", "es": "tarjetas de fotos verificadas PINNED KOREA"}, "Better interpreter (conversation mode, offline)": {"ja": "より優れた通訳（会話モード、オフライン）", "zh": "更好的口译（对话模式，离线）", "tw": "更好的口譯（對話模式，離線）", "es": "Mejor intérprete (modo conversación, sin conexión)"}, "Tourism agency and official statistics": {"ja": "観光庁と公式統計", "zh": "旅游机构和官方统计数据", "tw": "觀光旅遊局和官方統計數據", "es": "Agencia de turismo y estadísticas oficiales"}, "Filmed videos (YouTube, Instagram, TikTok)": {"ja": "ユーチューブやインスタグラム、ティックトックなどの動画を撮影しました", "zh": "拍摄的视频（YouTube，Instagram，TikTok）", "tw": "拍攝的影片（YouTube、Instagram、TikTok）", "es": "Vídeos filmados (YouTube, Instagram, TikTok)"}, "Real store locations appear once map data is connected.": {"ja": "マップデータが接続されると実店舗のロケーションが表示されます。", "zh": "连接地图数据后，真实店铺位置就会出现。", "tw": "連接地圖資料後，實體店鋪位置會出現。", "es": "Las ubicaciones reales de las tiendas aparecen una vez que se conectan los datos del mapa."}, "Real lodging appears once tourism lodging data is connected.": {"ja": "観光宿泊データが接続されると実際の宿泊施設が表示されます。", "zh": "真正的住宿信息会在连接旅游住宿数据后出现。", "tw": "當連接觀光旅宿資料後，實際的住宿資訊就會出現。", "es": "El alojamiento real aparece una vez que se conectan los datos de alojamiento turístico."}, "Public office location.": {"ja": "お役所の場所はどこですか", "zh": "办公室地址在哪里", "tw": "公務機關所在地", "es": "Ubicación de la oficina pública."}, "Routes and times appear once public transit data is connected.": {"ja": "公共交通データが接続されると、ルートや時間が表示されます。", "zh": "公共交通数据连接后会显示路线和时间。", "tw": "當連接公共交通資料後，路線和時間會出現。", "es": "Las rutas y los horarios aparecen una vez que se conectan los datos del transporte público."}, "Real dates appear once tourism event data is connected.": {"ja": "観光イベントのデータが接続されると、実際の日付が表示されます。", "zh": "当旅游活动数据连接后，真实日期就会出现。", "tw": "當連接旅遊活動資料後，實際日期將會出現。", "es": "Las fechas reales aparecen una vez que se conectan los datos del evento de turismo."}, "The description will be filled in after filming and data connection.": {"ja": "撮影とデータ接続後で説明を記入します。", "zh": "拍摄和数据连接完成后将填写描述", "tw": "拍攝及資料連接完成後將會填入描述。", "es": "La descripción se llenará después de la filmación y la conexión de datos."}, "Local tips will be added after our filming.": {"ja": "ローカルなヒントは私たちの撮影の後追加されます。", "zh": "拍摄完成后会添加当地提示。", "tw": "我們拍攝完成後會加入當地小提示。", "es": "Se agregarán consejos locales después de nuestra filmación."}, "The main royal palace of the Joseon dynasty, built in 1395.": {"ja": "チョソン王朝の主要な王宮で、1395年に建てられた。", "zh": "朝鲜王朝的主要皇宫，建于1395年。", "tw": "朝鮮王朝的主要皇宮，建於1395年。", "es": "El principal palacio real de la dinastía Joseon, construido en 1395."}, "Visitors wearing hanbok enter for free. Check the current rules before you go.": {"ja": "はんぼくを着用している訪問者は無料で入場できます。行く前に現在の規則を確認してください。", "zh": "穿着韩服的游客可以免费入场，在去之前请先查看当前的规则。", "tw": "穿著韓服的遊客可以免費入場，請在出發前先確認目前的規定。", "es": "Los visitantes que llevan hanbok entran de forma gratuita. Verifica las reglas actuales antes de ir."}, "A residential area of traditional hanok houses.": {"ja": "伝統的なハノクの家が並ぶ住宅街です。", "zh": "传统韩屋住宅区", "tw": "傳統韓屋的住宅區域", "es": "Un área residencial de casas hanok tradicionales."}, "People live here. Keep your voice down and be considerate when taking photos.": {"ja": "ここには人々が住んでいますので、声の大きさを抑え、写真を撮る際にも配慮してください。", "zh": "这里有人居住，请降低声音，并在拍照时注意不要打扰他人。", "tw": "這裡有人居住，請降低聲音並在拍照時注意他人。", "es": "La gente vive aquí, por favor mantén la voz baja y sé considerado al tomar fotos."}, "An observation tower on top of Namsan.": {"ja": "ナムサンの頂上にある展望塔です。", "zh": "南山山顶的观景塔", "tw": "南山山頂的觀景塔", "es": "Una torre de observación en la cima de Namsan."}, "A traditional market known for its food alleys.": {"ja": "伝統的な市場で、食べ物の小径で有名です。", "zh": "一个以美食小巷闻名的传统市场。", "tw": "一個以美食小巷聞名的傳統市場。", "es": "Un mercado tradicional conocido por sus calles de comida."}, "Payment methods differ by stall. Ask whether cards are accepted before you order.": {"ja": "支払い方法は店によって異なります。注文する前にカードが利用できるかどうかを聞いてください。", "zh": "每个摊位的付款方式都不同，请在点餐前先询问是否接受卡付。", "tw": "攤位的付款方式各有不同，在點餐前請先詢問是否接受信用卡付款。", "es": "Los métodos de pago varían según el puesto, así que pregunte si se aceptan tarjetas antes de pedir."}, "A fortress built under King Jeongjo, listed as a UNESCO World Heritage Site.": {"ja": "ジョンジョ王の時代に造られた城塞で、ユネスコの世界遺産にも登録されている。", "zh": "在正祖王统治期间建造的堡垒，被列为联合国教科文组织世界遗产。", "tw": "由正祖王所建造的堡壘，被列為聯合國教科文組織世界遺產。", "es": "Una fortaleza construida bajo el rey Jeongjo, incluida en la lista de sitios Patrimonio de la Humanidad de la UNESCO."}, "Gangwon’s signature national park, with scenery that changes by season.": {"ja": "江原道のシグネチャーな国立公園で、四季によって変化する風景です。", "zh": "江原道的标志性国家公园，随着季节变化的风景。", "tw": "江原道的標誌性國家公園，隨著季節變化而呈現不同的風景。", "es": "El parque nacional insignia de Gangwon, con un paisaje que cambia según la estación."}, "A street of cafés facing the var pad2=function(n){return (n<10?'0':'')+n;};
function ymd(d){return d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate());}
function ymdD(s){return new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8));}
function fmtD(s){try{return ymdD(s).toLocaleDateString(lang==='tw'?'zh-TW':lang==='zh'?'zh-CN':lang,{month:'short',day:'numeric'});}catch(e){return s;}}
function rangeD(e){return e.s===e.e?fmtD(e.s):fmtD(e.s)+' – '+fmtD(e.e);}
function nowAll(){return NOW.cul.concat(NOW.kto);}
function hasKo(x){return /[가-힣]/.test(x||'');}

var ILANGS=[['en','English','en-US','en'],['ja','日本語','ja-JP','ja'],['zh','简体中文','zh-CN','zh'],['tw','繁體中文','zh-TW','tw'],['es','Español','es-ES','es']];
var myL=lang==='ko'?'en':lang;try{var ml=localStorage.getItem('pk-my');if(ml&&ILANGS.some(function(x){return x[0]===ml;}))myL=ml;}catch(e){}
function IL(c){for(var i=0;i<ILANGS.length;i++)if(ILANGS[i][0]===c)return ILANGS[i];return ILANGS[0];}
var ilog=[],rec=null;
function gotoInterp(){var el=$('#sec-interp');el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});}
function speak(text,bcp){try{if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){toast(pk2(S.noSpeech));return;}
 var u=new SpeechSynthesisUtterance(text);u.lang=bcp;var vs=window.speechSynthesis.getVoices()||[];
 var v=vs.filter(function(x){return x.lang&&x.lang.replace('_','-')===bcp;})[0]||vs.filter(function(x){return x.lang&&x.lang.slice(0,2)===bcp.slice(0,2);})[0];if(v)u.voice=v;
 window.speechSynthesis.cancel();window.speechSynthesis.speak(u);}catch(e){toast(pk2(S.noSpeech));}}
function translate(text,from,to){return fetch('/api/translate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:text,from:from,to:to})}).then(function(r){return r.json().then(function(j){if(!r.ok||!j.text)throw new Error(j.error||'fail');return j.text;});});}
function renderLog(){var el=$('#ilog');
 if(!ilog.length){el.innerHTML='<p class="iempty">'+esc(t('ipEmpty'))+'</p>';return;}
 var h='';ilog.forEach(function(m,i){
  h+='<div class="msg '+m.dir+'"><div class="mo">'+esc(m.src)+'</div><div class="mt">'+(m.busy?'…':m.err?'<span class="merr">'+esc(pk2(S.trFail))+'</span>':esc(m.out))+'</div>';
  if(m.out)h+='<div class="ma"><button type="button" data-a="say" data-i="'+i+'">'+esc(t('listen'))+'</button><button type="button" data-a="big" data-i="'+i+'">'+esc(t('show'))+'</button></div>';
  h+='</div>';});
 el.innerHTML=h;el.scrollTop=el.scrollHeight;}
function outBcp(m){return m.dir==='me'?'ko-KR':IL(myL)[2];}
function addMsg(dir,text){
 var m={dir:dir,src:text,out:null,busy:true,err:false};ilog.push(m);if(ilog.length>40)ilog.shift();renderLog();
 var from=dir==='me'?IL(myL)[3]:'ko',to=dir==='me'?'ko':IL(myL)[3];
 translate(text,from,to).then(function(o){m.out=o;m.busy=false;renderLog();if($('#iauto').checked&&dir==='me')speak(o,'ko-KR');})
 .catch(function(){m.busy=false;m.err=true;renderLog();});
}
function setMic(dir){$('#micMe').classList.toggle('rec',dir==='me');$('#micKo').classList.toggle('rec',dir==='ko');}
var recT=0,recMax=0;
function stopMic(){clearTimeout(recT);clearTimeout(recMax);if(rec){var r=rec;rec=null;r.onresult=r.onerror=r.onend=null;try{r.abort();}catch(e){}}setMic(null);$('#ilive').textContent='';}
function listen(dir){
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){toast(pk2(S.noMic));$('#iin').focus();return;}
 if(rec){var cur=rec;try{cur.stop();}catch(e){stopMic();}return;}
 var r=new SR(),fin='',live=$('#ilive');rec=r;
 r.lang=dir==='ko'?'ko-KR':IL(myL)[2];r.interimResults=true;r.continuous=false;
 r.onresult=function(e){var s2='';for(var i=0;i<e.results.length;i++){s2+=e.results[i][0].transcript;}fin=s2;live.textContent=s2;
  clearTimeout(recT);recT=setTimeout(function(){try{r.stop();}catch(x){stopMic();}},1800);};
 r.onerror=function(e){if(e.error==='not-allowed'||e.error==='service-not-allowed')toast(pk2(S.micDenied));};
 r.onend=function(){clearTimeout(recT);clearTimeout(recMax);var had=fin.trim();rec=null;setMic(null);live.textContent='';if(had)addMsg(dir,had);};
 try{r.start();setMic(dir);live.textContent='…';recMax=setTimeout(function(){try{r.stop();}catch(x){stopMic();}},12000);}catch(e){stopMic();}
}

$('#ilog').addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var m=ilog[+b.getAttribute('data-i')];if(!m||!m.out)return;
 if(b.getAttribute('data-a')==='say')speak(m.out,outBcp(m));
 else{$('#showOv').innerHTML='<div class="bk">'+esc(m.out)+'</div><div class="bt">'+esc(m.src)+'</div><button type="button" id="bigClose">'+esc(t('close'))+'</button>';$('#showOv').hidden=false;$('#bigClose').focus();}});
(function(){var s=$('#myLang'),h='';ILANGS.forEach(function(l){h+='<option value="'+l[0]+'">'+l[1]+'</option>';});s.innerHTML=h;s.value=myL;
 s.addEventListener('change',function(){myL=s.value;try{localStorage.setItem('pk-my',myL);}catch(e){}applyInterp();});})();
function applyInterp(){
 $('#ipT').textContent=t('ipT');$('#ipL').textContent=t('ipL');
 $('#micMeT').textContent=t('ipMe')+' · '+IL(myL)[1];$('#micKoT').textContent=t('ipKo');
 $('#iin').placeholder=t('ipPh');$('#isend').textContent=t('ipSend');$('#ipAuto').textContent=t('ipAuto');
 $('#ipMyLbl').textContent=t('ipMyLang');$('#ipNote').textContent=pk2(S.ipNote);
 $('#ctaInt').lastChild.textContent=t('ipCta');$('#zint').setAttribute('aria-label',t('ipT'));$('#zint').title=t('ipT');
 renderLog();}

/* language */
function applyLang(){
 document.documentElement.lang=lang==='tw'?'zh-Hant':lang==='zh'?'zh-Hans':lang;
 $('#sosBtn').textContent=t('sos');
 $('#eyebrow').textContent=t('heroE');$('#h1').innerHTML=esc(t('heroA'))+' <span>'+esc(t('heroB'))+'</span>';$('#heroP').textContent=t('heroP');$('#heroQ').textContent=t('tagline');
 $('#q').placeholder=t('srchPh');$('#qBtn').textContent=t('srchBtn');$('#micro').textContent='';$('#ctaInt span').textContent=t('sInt');
 $('#zloc').setAttribute('aria-label',t('locBtn'));$('#zloc').title=t('locBtn');$('#zin').setAttribute('aria-label',pk2(S.zin));$('#zout').setAttribute('aria-label',pk2(S.zout));$('#zreset').setAttribute('aria-label',pk2(S.zreset));
 $('#mapNote').textContent='';$('#proto').textContent='';
$('#mapFail').textContent=pk2(S.mapFail);
 renderBoardStatic();renderBoard();renderTabs();renderChip();renderLegend();renderSections();if(phScene){var _sc=sceneById(phScene);if(_sc)loadScene(_sc);}labelPins();updateRegLabels();applyInterp();applyMapLang();
 if(sel!==null)renderSheet();
 if(!$('#sosOv').hidden)openSOS();
 if(W)render();
}
(function(){var s=$('#lang'),h='';LANGS.forEach(function(l){h+='<option value="'+l[0]+'">'+l[1]+'</option>';});s.innerHTML=h;s.value=lang;
 s.addEventListener('change',function(){lang=s.value;try{localStorage.setItem('pk-lang',lang);}catch(e){}applyLang();});})();

/* boot */
buildPins();
computeCache();
applyLang();
loadBoard();
layout();
initMap();
startWatch();
fetch('tour.json').then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){
 var R=j.regs,C=j.cats;j.d.forEach(function(r){addItem({lon:r[0],lat:r[1],cat:C[r[2]],ko:r[3],en:r[4],addr:r[5],reg:R[r[6]],cid:r[7],img:r[8]});});
 var F=j.feat||{};Object.keys(F).forEach(function(id){if(pIdx[id]!==undefined)ITEMS[pIdx[id]].p.img=F[id];});renderSections();loadNow();
 fetch('details.json').then(function(r){return r.ok?r.json():null;}).then(function(d){DET=d;if(sel!==null)renderSheet(true);}).catch(function(){});
 loadState='ok';computeCache();renderChip();renderLegend();updateRegLabels();render();
}).catch(function(){loadState='fail';renderChip();toast(pk2(S.loadFail));});
if(window.ResizeObserver){new ResizeObserver(function(){layout();}).observe(box);}else{window.addEventListener('resize',layout);}
})();
