    --bg:#0A1118;--surface:#121D27;--surface2:#1A2935;--fg:#E8F0F5;--muted:#9BB0BD;--line:#27394A;
    --accent:#FF4A3D;--accenttext:#FF7A6F;--sos:#E04545;
    --c-sight:#FF6A5C;--c-food:#FFB627;--c-stay:#6E93FF;--c-store:#3ECF94;--c-gov:#9AA6B8;--c-transit:#36C8E0;--c-event:#E070BC;--c-shop:#B58CFF;
    --glyph:#0B1416;--pinedge:#0A1118;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1118;--surface:#121D27;--surface2:#1A2935;--fg:#E8F0F5;--muted:#9BB0BD;--line:#27394A;
  --accent:#FF4A3D;--accenttext:#FF7A6F;--sos:#E04545;
  --c-sight:#FF6A5C;--c-food:#FFB627;--c-stay:#6E93FF;--c-store:#3ECF94;--c-gov:#9AA6B8;--c-transit:#36C8E0;--c-event:#E070BC;--c-shop:#B58CFF;
  --glyph:#0B1416;--pinedge:#0A1118;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--fontb);font-size:16px;line-height:1.5;margin:0;padding-block:0 0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--night)}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* night scope: header + hero + map keep one dark look in every theme */
.night{--surface:#122230;--surface2:#1B3144;--fg:#EAF3F8;--muted:#A3BBC9;--line:#2C4558;
  --accent:#FF4A3D;--accenttext:#FF7A6F;--glyph:#0B1416;--pinedge:#08141D;
  --c-sight:#FF6A5C;--c-food:#FFB627;--c-stay:#6E93FF;--c-store:#3ECF94;--c-gov:#A9B5C8;--c-transit:#36C8E0;--c-event:#E070BC;--c-shop:#B58CFF;
  background:var(--night);color:var(--fg);color-scheme:dark}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;border-bottom:1px solid #1B3144;padding:8px 0 6px}
.row1{display:flex;align-items:center;gap:10px}
.langw{display:flex;align-items:center;gap:6px;flex:none;background:#122230;border:1px solid #2C4558;border-radius:12px;padding:0 6px 0 10px;min-height:42px}
.langw svg{flex:none}
#lang{background:transparent;border:0;color:#EAF3F8;min-height:40px;font-weight:600;max-width:118px;padding:0 2px}
#lang option{color:#0E1A24;background:#fff}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;justify-content:center}
.wm{font-weight:800;font-size:18px;letter-spacing:.04em;white-space:nowrap}
.wm span{color:var(--accent)}
.sos{flex:none;background:var(--sos);color:#fff;border:0;border-radius:999px;font-weight:800;min-height:42px;padding:0 16px;letter-spacing:.04em}
.tabs{display:flex;justify-content:space-between;gap:4px;padding:8px 0 2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 1 auto;white-space:nowrap;background:transparent;color:#C9DAE5;border:1px solid #2C4558;border-radius:999px;padding:4px 6px;font-size:12.5px;font-weight:600;min-height:34px}
@media (max-width:430px){.brand svg{display:none}.wm{font-size:15.5px;letter-spacing:.02em}.langw{padding:0 2px 0 8px}#lang{max-width:96px}.tab{padding:4px 3px;font-size:12px}}
.tab:hover{background:#1B3144}

/* hero */
.hero{padding:22px 0 20px;background:radial-gradient(120% 80% at 50% 0%,#12303F 0%,#08141D 62%)}
.h1{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,16px);margin:0;font-weight:800;font-size:clamp(34px,10.4vw,84px);line-height:1;letter-spacing:.015em;white-space:nowrap}
.h1 span{color:var(--accent)}
.h1 svg{height:.92em;width:auto;flex:none;filter:drop-shadow(0 0 14px rgba(255,74,61,.55))}
.tagline{text-align:center;font-weight:600;font-size:clamp(17px,4.6vw,26px);margin:10px 0 2px;text-wrap:balance}
.sub{text-align:center;color:var(--muted);font-size:14px;margin:0 0 14px;text-wrap:balance}

/* map */
.mapbox{position:relative;height:clamp(500px,76vh,760px);border-radius:20px;overflow:hidden;border:1px solid #2C4558;background:radial-gradient(90% 70% at 50% 40%,#0E2634 0%,#06111A 100%);touch-action:pan-y;user-select:none;-webkit-user-select:none;box-shadow:0 0 0 1px rgba(255,255,255,.03),0 18px 50px rgba(0,0,0,.45)}
.land{position:absolute;inset:0;width:100%;height:100%;display:block}
.grat{fill:none;stroke:#13303F;stroke-width:1px;vector-effect:non-scaling-stroke}
.nb{fill:#0F2230;stroke:#1C3A4C;stroke-width:1px;vector-effect:non-scaling-stroke}
.glow{fill:none;stroke:#66D9FF;stroke-width:5px;stroke-linejoin:round;opacity:.28;vector-effect:non-scaling-stroke;filter:blur(3px)}
.pf{fill:#1D4256}
.pf.on{fill:#5E2A2E}
.muni{fill:none;stroke:#8EB4C6;stroke-width:.7px;stroke-dasharray:2 3;vector-effect:non-scaling-stroke}
.ps{fill:none;stroke:#D6E9F2;stroke-width:1.2px;stroke-dasharray:6 4;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.coast{fill:none;stroke:#7EE3FF;stroke-width:1.5px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.defs path{vector-effect:non-scaling-stroke}
.pins{position:absolute;inset:0;pointer-events:none}
.pins>*{pointer-events:auto}
.mlab{position:absolute;left:0;top:0;display:none;pointer-events:none;color:#CFE3EE;font-size:11px;font-weight:600;text-shadow:0 0 3px #06111A,0 0 3px #06111A;white-space:nowrap;transform:translate(-50%,-50%)}
.rpin{position:absolute;left:0;top:0;display:none;align-items:center;gap:6px;background:rgba(8,20,29,.78);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 10px 4px 7px;font-size:12.5px;font-weight:600;line-height:1.2;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.rpin svg{flex:none;width:14px;height:18px;display:block}
.rpin .pg{fill:rgba(255,255,255,.5)}
.rpin .pd{fill:#08141D}
.rpin i{font-style:normal;font-variant-numeric:tabular-nums;font-size:11.5px;opacity:.8}
.rpin.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,74,61,.25),0 2px 10px rgba(0,0,0,.5)}
.rpin.on .pg{fill:var(--accent);filter:drop-shadow(0 0 5px rgba(255,74,61,.9))}
.rpin.lite{padding:4px 5px;border-radius:12px}
.rpin.lite b,.rpin.lite i{display:none}
.rpin.done{border-color:#3ECF94}
.pin{position:absolute;left:0;top:0;width:28px;height:36px;padding:0;border:0;background:none;display:none;will-change:transform}
.pin svg{display:block;width:28px;height:36px;overflow:visible;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.pin .chk,.pin .flm{display:none}
.pin.vis .chk{display:inline}
.pin.film .flm{display:inline}
.pin.sel{z-index:5}
.pin.sel svg{transform:scale(1.3);transform-origin:50% 100%}
.plabel{position:absolute;left:50%;top:-22px;transform:translateX(-50%);white-space:nowrap;background:#fff;color:#08141D;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;display:none;pointer-events:none}
.pin.sel .plabel{display:block}
.cl{position:absolute;left:0;top:0;width:36px;height:36px;border-radius:50%;display:none;align-items:center;justify-content:center;background:#fff;color:#08141D;border:3px solid #FF4A3D;font-weight:800;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.ctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:8}
.ctl button{width:42px;height:42px;border-radius:12px;border:1px solid #2C4558;background:rgba(8,20,29,.82);color:#fff;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center}
.chip{position:absolute;left:10px;top:10px;z-index:7;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 70px)}
.chip span{background:rgba(8,20,29,.82);border:1px solid #2C4558;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.chip b{color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 8px}
.lg{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 5px;border-radius:999px;border:1px solid #2C4558;background:#122230;font-size:13px;font-weight:600;min-height:34px}
.lg[aria-pressed="false"]{opacity:.45}
.lg svg{display:block}
.note{font-size:12.5px;color:var(--muted);margin:0 0 4px}

/* sheet */
.sheet{position:absolute;left:8px;right:8px;bottom:8px;max-height:62%;overflow:auto;background:rgba(14,28,40,.97);border:1px solid #2C4558;border-radius:16px;padding:12px 14px 14px;z-index:9;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.sh-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.tag i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.reg{font-size:13px;color:var(--muted);flex:1}
.x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:20px;line-height:1}
.sheet h3{font-weight:800;font-size:22px;line-height:1.25;margin:2px 0 6px}
.sheet p{margin:0 0 8px}
.dim{color:var(--muted);font-size:13px}
.vbtn{width:100%;min-height:46px;border-radius:12px;border:2px solid var(--c-store);background:transparent;font-weight:700;margin:2px 0 10px}
.vbtn[aria-pressed="true"]{background:var(--c-store);color:#08141D}
.box{background:var(--surface2);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.box h4{margin:0 0 4px;font-size:13px;letter-spacing:.04em;color:var(--muted)}
.box p{margin:0}
.nr{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 0;min-height:40px;font-size:14px}
.nr:first-of-type{border-top:0}
.nr i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.nr span{flex:1;min-width:0}
.nr em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.sns{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.sns span{border:1px dashed var(--muted);color:var(--muted);border-radius:999px;padding:4px 12px;font-size:13px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links a{display:flex;align-items:center;justify-content:center;text-align:center;min-height:46px;border-radius:12px;background:#fff;color:#08141D;text-decoration:none;font-weight:700;font-size:14px;padding:6px 8px}
.tagx{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px dashed var(--muted);color:var(--muted);border-radius:6px;padding:0 6px}

/* content bands */
.band{padding:34px 0 6px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 110px)}
.h2{font-weight:800;font-size:clamp(24px,5.4vw,34px);line-height:1.2;margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 16px;max-width:70ch}
.best{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:0;padding:0;list-style:none}
.bc{width:100%;height:100%;text-align:left;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.bc:hover{background:var(--surface2)}
.rk{font-weight:800;font-size:44px;line-height:1;color:var(--accenttext);font-variant-numeric:tabular-nums}
.bc h3{font-weight:800;font-size:19px;line-height:1.3;margin:0}
.bc .r{font-size:13px;color:var(--muted)}
.bc p{margin:0;font-size:15px;flex:1}
.go{font-size:13px;font-weight:700;color:var(--accenttext)}
.rev,.phr,.off{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.rv{border:1px dashed var(--muted);border-radius:18px;padding:16px}
.rv p{margin:8px 0 6px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.cc{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 14px;min-height:46px;font-weight:600;flex:1 1 auto;justify-content:center}
.cc code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-weight:700;background:var(--surface2);border-radius:6px;padding:2px 6px}
.cc[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cc[aria-pressed="true"] code{background:var(--bg);color:var(--fg)}
.rank{margin:0 0 10px;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.rank button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-height:56px}
.rank b{font-weight:800;font-size:22px;width:26px;color:var(--accenttext)}
.rank span{flex:1;min-width:0}
.rank small{display:block;color:var(--muted);font-size:13px}
.oc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.oc h3{margin:0 0 2px;font-size:17px;font-weight:700}
.oc .o{font-size:13px;color:var(--muted);margin:0 0 6px}
.oc p{margin:0 0 10px}
.oc a{font-weight:700;font-size:14px;color:var(--accenttext)}
.st{display:inline-block;font-size:12px;font-weight:700;background:var(--surface2);border-radius:6px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.pc .pg{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.pk{font-weight:800;font-size:28px;line-height:1.3;margin:2px 0}
.prm{color:var(--muted);font-size:14px;margin:0}
.pt{font-size:17px;margin:8px 0 10px}
.pb{display:flex;gap:8px}
.pb button{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:700;font-size:14px}
.pb button.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.next{margin:0;padding-left:20px;color:var(--muted)}
footer{padding:34px 0 calc(48px + env(safe-area-inset-bottom,0px))}
footer .h2{font-size:18px}

/* overlays */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{background:var(--surface);color:var(--fg);border-radius:20px;width:min(560px,100%);max-height:88vh;overflow:auto;padding:18px}
.panel h2{font-weight:800;font-size:24px;margin:0 0 10px}
.sr{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:10px 0}
.sr:first-of-type{border-top:0}
.sr strong{font-weight:800;font-size:30px;min-width:92px;user-select:all;-webkit-user-select:all;font-variant-numeric:tabular-nums}
.sr span{flex:1;min-width:0}
.sr a{flex:none;background:var(--sos);color:#fff;text-decoration:none;font-weight:700;border-radius:10px;padding:8px 14px;min-height:40px;display:flex;align-items:center}
.close{margin-top:12px;width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:700}
.ov.big{background:#08141D;color:#fff;align-items:center;flex-direction:column;justify-content:center;text-align:center;gap:18px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.ov.big .bk{font-weight:800;font-size:clamp(40px,13vw,84px);line-height:1.25;text-wrap:balance}
.ov.big .bt{font-size:clamp(18px,5vw,28px);opacity:.85}
.ov.big button{min-height:50px;padding:0 28px;border-radius:14px;border:2px solid #fff;background:transparent;color:#fff;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 16px;font-size:14px;max-width:90vw}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<header class="night top" id="top"><div class="wrap">
  <div class="row1">
    <label class="langw"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EAF3F8" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c3 3.2 3 15.8 0 19M12 2.5c-3 3.2-3 15.8 0 19"/></svg><span class="vh">Language</span><select id="lang"></select></label>
    <div class="brand">
      <svg width="20" height="26" viewBox="0 0 28 36" aria-hidden="true"><path d="M14 35C14 35 3 23 3 13A11 11 0 0 1 25 13C25 23 14 35 14 35Z" fill="#FF4A3D"/><circle cx="14" cy="13" r="4.6" fill="#08141D"/></svg>
      <span class="wm">PINNED <span>KOREA</span></span>
    </div>
    <button class="sos" id="sosBtn" type="button"></button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div></header>

<main>
  <section class="night hero" id="sec-map"><div class="wrap">
    <h1 class="h1"><svg viewBox="0 0 28 36" aria-hidden="true"><path d="M14 35C14 35 3 23 3 13A11 11 0 0 1 25 13C25 23 14 35 14 35Z" fill="#FF4A3D"/><circle cx="14" cy="13" r="4.6" fill="#08141D"/></svg><span style="color:#fff">PINNED</span><span>KOREA</span></h1>
    <p class="tagline" id="tagline"></p>
    <p class="sub" id="sub"></p>
    <div class="mapbox" id="mapbox">
      <svg class="land" id="landsvg" aria-hidden="true"><g id="world"></g></svg>
      <div class="pins" id="pins"></div>
      <div class="chip" id="chip"></div>
      <div class="ctl">
        <button type="button" id="zin">+</button>
        <button type="button" id="zout">&minus;</button>
        <button type="button" id="zreset"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8V3h5M12 3h5v5M17 12v5h-5M8 17H3v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="sheet" id="sheet" hidden></div>
    </div>
    <div class="legend" id="legend"></div>
    <p class="note" id="mapNote"></p>
    <p class="note" id="proto"></p>
  </div></section>
  <div class="wrap">
    <section class="band" id="sec-best"></section>
    <section class="band" id="sec-rev"></section>
    <section class="band" id="sec-ctry"></section>
    <section class="band" id="sec-off"></section>
    <section class="band" id="sec-phr"></section>
  </div>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<div class="ov" id="sosOv" hidden role="dialog" aria-modal="true"><div class="panel" id="sosPanel"></div></div>
<div class="ov big" id="showOv" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" hidden></div>

<script>

  b.classList.toggle('film',!!(it.p&&it.p.film));b.classList.toggle('vis',!!visited[vkey(it)]);b.classList.toggle('sel',i===sel);
  b.querySelector('.plabel').textContent=i===sel?itName(it):'';
  b.style.display='block';b.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px) translate(-50%,-100%)';b.style.zIndex=z;}
 cells.forEach(function(c){
  if(c.n===1){placePin(c.i,c.sx,c.sy,it_z(c));}
  else{var cx=c.sx/c.n,cy=c.sy/c.n,e=getCl(ci++);e.textContent=fmtN(c.n);e._bx=(cx-st.tx)/st.k;e._by=(cy-st.ty)/st.k;
   var sz=c.n>=100?46:c.n>=10?40:34;e.style.width=sz+'px';e.style.height=sz+'px';e.style.display='flex';e.style.transform='translate('+cx.toFixed(1)+'px,'+cy.toFixed(1)+'px) translate(-50%,-50%)';e.setAttribute('aria-label',String(c.n));}});
 if(selPos)placePin(sel,selPos.x,selPos.y,9);
 function it_z(c){return ITEMS[c.i].p?4:Math.round(c.sy/10)%3;}
 for(var j=pn;j<pool.length;j++)pool[j].style.display='none';
 for(var j2=ci;j2<clEls.length;j2++)clEls[j2].style.display='none';
}

/* gestures */
var ptrs={},pinch=null,moved=false;
box.addEventListener('pointerdown',function(e){if(e.target.closest('button,.sheet,.ctl'))return;ptrs[e.pointerId]={x:e.clientX,y:e.clientY};moved=false;try{box.setPointerCapture(e.pointerId);}catch(_){}});
box.addEventListener('pointermove',function(e){var p=ptrs[e.pointerId];if(!p)return;var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;var ids=Object.keys(ptrs);
 if(ids.length===1){if(Math.abs(dx)+Math.abs(dy)>1)moved=true;if(st.k>1.01){st.tx+=dx;st.ty+=dy;clampSt();render();}}
 else if(ids.length===2){moved=true;var a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y);if(!pinch){pinch={d:d,k:st.k};return;}var r=box.getBoundingClientRect();zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,pinch.k*d/pinch.d);}});
function endp(e){delete ptrs[e.pointerId];if(Object.keys(ptrs).length<2)pinch=null;}
box.addEventListener('pointerup',endp);box.addEventListener('pointercancel',endp);
box.addEventListener('click',function(e){if(moved){moved=false;return;}if(e.target.closest('button,.sheet,.ctl'))return;closeSheet();});
box.addEventListener('dblclick',function(e){if(e.target.closest('button,.sheet,.ctl'))return;var r=box.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,st.k*2);});
box.addEventListener('wheel',function(e){if(e.target.closest('.sheet'))return;e.preventDefault();var r=box.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,st.k*Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0016)));},{passive:false});
$('#zin').addEventListener('click',function(){zoomBy(1.8);});
$('#zout').addEventListener('click',function(){zoomBy(1/1.8);});
$('#zreset').addEventListener('click',function(){animateTo(1,0,0);closeSheet();});

/* selection + sheet */
function hav(a,b){var R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r,x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(x));}
var NEARCATS=['transit','stay','food','sight','event'];
function nearby(i){var me=ITEMS[i],best={},bd={},cosl=Math.cos(me.lat*Math.PI/180);
 for(var j=0;j<ITEMS.length;j++){if(j===i)continue;var o=ITEMS[j];if(o.cat===me.cat||NEARCATS.indexOf(o.cat)<0)continue;
  var dx=(o.lon-me.lon)*111*cosl,dy=(o.lat-me.lat)*111;if(Math.abs(dx)>5||Math.abs(dy)>5)continue;var d=Math.sqrt(dx*dx+dy*dy);
  if(d<=5&&(bd[o.cat]===undefined||d<bd[o.cat])){bd[o.cat]=d;best[o.cat]=j;}}
 var out=[];NEARCATS.forEach(function(c){if(best[c]!==undefined)out.push({i:best[c],d:bd[c]});});return out;}
function mapLinks(it){var q=encodeURIComponent(it.p?(it.p.q||it.p.n[0]):(it.ko||it.en));return {n:'https://map.naver.com/p/search/'+q,k:'https://map.kakao.com/link/search/'+q};}
function renderSheet(){
 var it=ITEMS[sel];if(!it){sheet.hidden=true;return;}
 var p=it.p,col='var(--c-'+it.cat+')',near=nearby(sel),L=mapLinks(it),isV=!!visited[vkey(it)],h='';
 h+='<div class="sh-top"><span class="tag" style="--c:'+col+'"><i></i>'+esc(catName(it.cat))+'</span><span class="reg">'+esc(regName(it.reg))+'</span><button class="x" type="button" data-act="close" aria-label="'+esc(t('close'))+'">&times;</button></div>';
 h+='<h3>'+esc(itName(it))+'</h3>';
 var alt=itAlt(it);if(alt)h+='<p class="dim" style="margin-top:-4px">'+esc(alt)+'</p>';
 if(p){h+='<p>'+esc(pk2(p.d||DEFD[p.cat]))+' <span class="tagx">'+esc(t('sample'))+'</span></p>';
  var an=t('autoTr');if(an)h+='<p class="dim">'+esc(an)+'</p>';}
 else{h+='<p>'+esc(it.addr)+'</p>';}
 if(canVisit(it)){h+='<button class="vbtn" type="button" data-act="visit" aria-pressed="'+isV+'">'+esc(isV?t('visited')+' ✓':t('visit'))+'</button><p class="dim" style="margin-top:-6px">'+esc(pk2(S.saveNote))+'</p>';}
 if(p){h+='<div class="box"><h4>'+esc(t('tip'))+'</h4><p>'+esc(pk2(p.g||DEFTIP))+'</p></div>';}
 h+='<div class="box"><h4>'+esc(t('near'))+'</h4>';
 if(near.length){near.forEach(function(n){var o=ITEMS[n.i];h+='<button class="nr" type="button" data-act="go" data-i="'+n.i+'" style="--c:var(--c-'+o.cat+')"><i></i><span>'+esc(catName(o.cat))+' · '+esc(itName(o))+'</span><em>'+(n.d<1?Math.round(n.d*10)*100+' m':n.d.toFixed(1)+' km')+'</em></button>';});}
 else h+='<p class="dim">'+esc(pk2(S.noNear))+'</p>';
 h+='</div>';
 if(p){h+='<div class="box"><h4>'+esc(t('sns'))+(p.film?' <span class="tagx">'+esc(t('planned'))+'</span>':'')+'</h4><div class="sns"><span>YouTube</span><span>Instagram</span><span>TikTok</span></div><p class="dim">'+esc(pk2(S.snsNote))+'</p></div>';}
 else{h+='<p class="dim">'+esc(pk2(S.srcNote))+'</p>';}
 h+='<div class="links"><a href="'+L.n+'" target="_blank" rel="noopener">'+esc(t('openNaver'))+'</a><a href="'+L.k+'" target="_blank" rel="noopener">'+esc(t('openKakao'))+'</a></div>';
 sheet.innerHTML=h;sheet.hidden=false;
}
function selectItem(i,k){
 var it=ITEMS[i];if(!it)return;
 if(!active[it.cat]){active[it.cat]=true;renderLegend();}
 sel=i;renderSheet();sheet.scrollTop=0;
 var b=base(it.lon,it.lat),nk=Math.max(st.k,k||6);animateTo(nk,W/2-b[0]*nk,H*0.27-b[1]*nk);
}
function closeSheet(){sel=null;sheet.hidden=true;render();}
sheet.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;var a=el.getAttribute('data-act');
 if(a==='close')closeSheet();
 else if(a==='visit'){var key=vkey(ITEMS[sel]);if(visited[key])delete visited[key];else visited[key]=1;saveV();computeCache();renderSheet();renderChip();updateRegLabels();render();}
 else if(a==='go')selectItem(+el.getAttribute('data-i'),Math.max(st.k,9));});

/* sections */
function renderChip(){
 var rv=0;REG.forEach(function(r){if(regStats(r.k)[0]>0)rv++;});
 var h='<span>'+esc(t('mSpots'))+' <b>'+totalVisited()+'</b></span><span>'+esc(t('mRegs'))+' <b>'+rv+'</b>/'+REG.length+'</span>';
 if(loadState==='loading')h+='<span>'+esc(pk2(S.loading))+'</span>';
 $('#chip').innerHTML=h;
}
function renderLegend(){
 var h='';CATS.forEach(function(c){h+='<button type="button" class="lg" data-c="'+c+'" aria-pressed="'+!!active[c]+'" style="--c:var(--c-'+c+')"><svg width="22" height="22" viewBox="3 2 22 22" aria-hidden="true"><circle cx="14" cy="13" r="11" fill="var(--c)"/>'+GLYPH[c]+'</svg>'+esc(catName(c))+(catCount[c]?' <i style="font-style:normal;opacity:.7">'+catCount[c].toLocaleString('en-US')+'</i>':'')+'</button>';});
 $('#legend').innerHTML=h;
}
$('#legend').addEventListener('click',function(e){var b=e.target.closest('.lg');if(!b)return;var c=b.getAttribute('data-c');active[c]=!active[c];if(sel!==null&&ITEMS[sel].cat===c&&!active[c])closeSheet();renderLegend();render();});
function bestHTML(){
 var h='<h2 class="h2">'+esc(t('bestT'))+'</h2><p class="lead">'+esc(pk2(S.bestN))+'</p><ol class="best">';
 BEST.forEach(function(b,i){var p=byId[b.id];h+='<li><button class="bc" type="button" data-id="'+p.id+'"><span class="rk">'+(i+1)+'</span><h3>'+esc(nm(p))+'</h3><span class="r">'+esc(regName(p.reg))+' · '+esc(catName(p.cat))+'</span><p>'+esc(pk2(b.r))+'</p><span class="go">'+esc(t('seeMap'))+' →</span></button></li>';});
 return h+'</ol>';
}
function revHTML(){
 var h='<h2 class="h2">'+esc(t('revT'))+'</h2><p class="lead">'+esc(pk2(S.revL))+'</p><div class="rev">';
 for(var i=0;i<2;i++)h+='<div class="rv"><span class="tagx">'+esc(t('revLay'))+'</span><p>'+esc(pk2(S.revTxt))+'</p><span class="dim">'+esc(pk2(S.revWho))+'</span></div>';
 return h+'</div>';
}
function ctryHTML(){
 var h='<h2 class="h2">'+esc(t('ctryT'))+'</h2><p class="lead">'+esc(pk2(S.ctryL))+'</p><div class="chips" role="group">';
 CTRY.forEach(function(c,i){h+='<button class="cc" type="button" data-i="'+i+'" aria-pressed="'+(i===ctryIdx)+'"><code>'+c.c+'</code>'+esc(pick(c.n))+'</button>';});
 h+='</div><ol class="rank">';
 CTRY[ctryIdx].ids.forEach(function(id,i){var p=byId[id];h+='<li><button type="button" data-id="'+id+'"><b>'+(i+1)+'</b><span>'+esc(nm(p))+'<small>'+esc(regName(p.reg))+'</small></span><span class="go">'+esc(t('seeMap'))+' →</span></button></li>';});
 return h+'</ol><p class="note"><span class="tagx">'+esc(t('sample'))+'</span> '+esc(pk2(S.ctryN))+'</p>';
}
function offHTML(){
 var h='<h2 class="h2">'+esc(t('offT'))+'</h2><p class="lead">'+esc(pk2(S.offL))+'</p><div class="off">';
 OFF.forEach(function(o){h+='<div class="oc"><h3>'+esc(pk2(o.n))+'<span class="st">'+esc(t('soon'))+'</span></h3><p class="o">'+esc(pk2(o.o))+'</p><p>'+esc(pk2(o.d))+'</p><a href="'+o.u+'" target="_blank" rel="noopener">'+esc(t('openSite'))+' →</a></div>';});
 return h+'</div>';
}
function phrHTML(){
 var h='<h2 class="h2">'+esc(t('phrT'))+'</h2><p class="lead">'+esc(pk2(S.phrL))+'</p><div class="phr">';
 PH.forEach(function(p,i){var x=pick(p.x)||p.x[1];h+='<div class="pc"><span class="pg">'+esc(pick(p.g))+'</span><div class="pk">'+esc(p.ko)+'</div><p class="prm">'+esc(p.ro)+'</p><p class="pt">'+(lang==='ko'?'':esc(x))+'</p><div class="pb"><button type="button" class="pri" data-show="'+i+'">'+esc(t('show'))+'</button><button type="button" data-say="'+i+'">'+esc(t('listen'))+'</button></div></div>';});
 return h+'</div>';
}
function footHTML(){var h='<h2 class="h2">'+esc(t('nextT'))+'</h2><ul class="next">';NEXT.forEach(function(n){h+='<li>'+esc(pk2(n))+'</li>';});return h+'</ul>';}
function renderSections(){
 $('#sec-best').innerHTML=bestHTML();$('#sec-rev').innerHTML=revHTML();$('#sec-ctry').innerHTML=ctryHTML();
 $('#sec-off').innerHTML=offHTML();$('#sec-phr').innerHTML=phrHTML();$('#foot').innerHTML=footHTML();
}
function jumpToSpot(id,k){$('#mapbox').scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'});setTimeout(function(){selectItem(pIdx[id],k||7);},reduce?0:250);}
$('#sec-best').addEventListener('click',function(e){var b=e.target.closest('.bc');if(b)jumpToSpot(b.getAttribute('data-id'));});
$('#sec-ctry').addEventListener('click',function(e){
 var c=e.target.closest('.cc');if(c){ctryIdx=+c.getAttribute('data-i');$('#sec-ctry').innerHTML=ctryHTML();return;}
 var b=e.target.closest('.rank button');if(b)jumpToSpot(b.getAttribute('data-id'));});

var TABS=[['sec-map','sMap'],['sec-best','sBest'],['sec-rev','sRev'],['sec-ctry','sCtry'],['sec-off','sOff'],['sec-phr','sPhr']];
function renderTabs(){var h='';TABS.forEach(function(x){h+='<button type="button" class="tab" data-t="'+x[0]+'">'+esc(t(x[1]))+'</button>';});$('#tabs').innerHTML=h;}
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('.tab');if(!b)return;var el=document.getElementById(b.getAttribute('data-t'));if(el)el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});});

/* overlays */
var toastT=0;function toast(m){var el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true;},2600);}
function openSOS(){
 var h='<h2>'+esc(t('sosT'))+'</h2>';
 SOSL.forEach(function(s){h+='<div class="sr"><strong>'+s.n+'</strong><span>'+esc(pick(s.l))+'</span><a href="tel:'+s.n+'">'+esc(t('call'))+'</a></div>';});
 h+='<p class="dim" style="margin-top:10px">'+esc(pk2(S.sosFoot))+'</p><button class="close" type="button" id="sosPhrBtn">'+esc(t('sosPhr'))+'</button><button class="close" type="button" id="sosClose" style="margin-top:8px">'+esc(t('close'))+'</button>';
 $('#sosPanel').innerHTML=h;$('#sosOv').hidden=false;$('#sosClose').focus();
}
function closeSOS(){$('#sosOv').hidden=true;}
$('#sosBtn').addEventListener('click',openSOS);
$('#sosOv').addEventListener('click',function(e){if(e.target.id==='sosOv'||e.target.id==='sosClose')closeSOS();
 if(e.target.id==='sosPhrBtn'){closeSOS();var el=$('#sec-phr');el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});}});
function showBig(i){var p=PH[i],x=pick(p.x)||p.x[1];
 $('#showOv').innerHTML='<div class="bk">'+esc(p.ko)+'</div><div class="bt">'+(lang==='ko'?esc(p.ro):esc(x))+'</div><button type="button" id="bigClose">'+esc(t('close'))+'</button>';
 $('#showOv').hidden=false;$('#bigClose').focus();}
$('#showOv').addEventListener('click',function(e){if(e.target.id==='bigClose'||e.target.id==='showOv')$('#showOv').hidden=true;});
function say(i){try{if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){toast(pk2(S.noSpeech));return;}
 var u=new SpeechSynthesisUtterance(PH[i].ko);u.lang='ko-KR';window.speechSynthesis.cancel();window.speechSynthesis.speak(u);}catch(e){toast(pk2(S.noSpeech));}}
$('#sec-phr').addEventListener('click',function(e){var s=e.target.closest('[data-show]');if(s){showBig(+s.getAttribute('data-show'));return;}var a=e.target.closest('[data-say]');if(a)say(+a.getAttribute('data-say'));});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeSOS();$('#showOv').hidden=true;}});

/* language */
function applyLang(){
 document.documentElement.lang=lang==='tw'?'zh-Hant':lang==='zh'?'zh-Hans':lang;
 $('#sosBtn').textContent=t('sos');
 $('#tagline').textContent=t('tagline');$('#sub').textContent=t('sub');
 $('#zin').setAttribute('aria-label',pk2(S.zin));$('#zout').setAttribute('aria-label',pk2(S.zout));$('#zreset').setAttribute('aria-label',pk2(S.zreset));
 $('#mapNote').textContent=pk2(S.mapNote);$('#proto').textContent=pk2(S.proto);
 renderTabs();renderChip();renderLegend();renderSections();labelPins();updateRegLabels();
 if(sel!==null)renderSheet();
 if(!$('#sosOv').hidden)openSOS();
 if(W)render();
}
(function(){var s=$('#lang'),h='';LANGS.forEach(function(l){h+='<option value="'+l[0]+'">'+l[1]+'</option>';});s.innerHTML=h;s.value=lang;
 s.addEventListener('change',function(){lang=s.value;try{localStorage.setItem('pk-lang',lang);}catch(e){}applyLang();});})();

/* boot */
buildWorld();
buildPins();
computeCache();
applyLang();
fetch('tour.json').then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){
 var R=j.regs,C=j.cats;j.d.forEach(function(r){addItem({lon:r[0],lat:r[1],cat:C[r[2]],ko:r[3],en:r[4],addr:r[5],reg:R[r[6]],cid:r[7]});});
 loadState='ok';computeCache();renderChip();renderLegend();updateRegLabels();render();
}).catch(function(){loadState='fail';renderChip();toast(pk2(S.loadFail));});
layout();
if(window.ResizeObserver){new ResizeObserver(function(){layout();}).observe(box);}else{window.addEventListener('resize',layout);}
})();
</script>
